name: automation-verify

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.58.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native audit/build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep protobuf-compiler

      - name: Resolve hardening dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path("app/rust/crates/seo_application/src/drafting.rs"),
              Path("app/rust/crates/seo_application/src/scenario/tests.rs"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              old = 'freshness_class: "watch".to_string(),'
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one stale watch fixture in {path}, found {count}")
              path.write_text(text.replace(old, 'freshness_class: "fresh".to_string()'), encoding="utf-8")
          PY
          (cd app/rust && cargo update)
          (cd app/rust && cargo fmt --all)

      - name: Upload dependency resolver output
        uses: actions/upload-artifact@v4
        with:
          name: dependency-resolver-output
          path: |
            app/rust/Cargo.lock
            app/rust/crates/seo_application/src/drafting.rs
            app/rust/crates/seo_application/src/scenario/tests.rs

      - name: Run full automation audit
        run: bash automation/audit.sh full

      - name: Upload consistency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-reports
          path: |
            automation/reports/consistency_report.json
            automation/reports/consistency_report.md
