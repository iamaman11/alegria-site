name: automation-verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.64.0"
      # Disposable integration database, never a production credential.
      DATABASE_URL: postgres://alegria_ci:alegria_ci_only@127.0.0.1:5432/alegria_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alegria_ci
          POSTGRES_PASSWORD: alegria_ci_only
          POSTGRES_DB: alegria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alegria_ci -d alegria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native audit/build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep protobuf-compiler

      - name: Initialize disposable integration schema
        run: |
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f app/db/schema.sql

      - name: Run full automation audit
        run: bash automation/audit.sh full

      - name: Upload consistency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-reports
          path: |
            automation/reports/consistency_report.json
            automation/reports/consistency_report.md
