name: automation-verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
      # Disposable integration database, never a production credential.
      DATABASE_URL: postgres://alegria_ci:alegria_ci_only@127.0.0.1:5432/alegria_ci
      # Only this disposable CI database may run scoped truth SQL smoke tests.
      ALEGRIA_SCOPED_TRUTH_TEST: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alegria_ci
          POSTGRES_PASSWORD: alegria_ci_only
          POSTGRES_DB: alegria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alegria_ci -d alegria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check ruff==0.17.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native audit/build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep protobuf-compiler

      - name: Initialize disposable integration schema
        run: |
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f app/db/schema.sql

      - name: Run full automation audit
        run: bash automation/audit.sh full

      - name: Upload consistency reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-reports
          path: |
            automation/reports/consistency_report.json
            automation/reports/consistency_report.md

  windows-operator-smoke:
    name: Native Windows first-site operator regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical GitHub source
        uses: actions/checkout@v7

      - name: Setup native Windows Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run credential-free first-site and publication regressions
        shell: pwsh
        run: |
          python automation/check_windows_staging_rollback.py
          pwsh -NoProfile -NonInteractive -File automation/smoke_windows_staging_reconcile.ps1
          python automation/smoke_e2e_first_site.py
          python automation/smoke_first_site_doctor.py
          python automation/smoke_e2e_canonical_temporal.py
          python automation/smoke_first_site_release.py
          python automation/smoke_e2e_publication_verdict.py
          python automation/smoke_seo_cloudflare_deploy.py
          python automation/smoke_public_static_output_completeness.py
          python automation/smoke_public_http_readback.py
