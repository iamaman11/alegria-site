name: automation-verify

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.64.0"
      REBUILD_SMOKE_DATABASE_URL: "postgres://alegria:alegria_ci_password@127.0.0.1:5432/alegria_ci"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alegria_ci
          POSTGRES_USER: alegria
          POSTGRES_PASSWORD: alegria_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alegria -d alegria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native audit/build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep protobuf-compiler postgresql-client

      - name: Prepare real PostgreSQL audit fixture
        run: psql "$REBUILD_SMOKE_DATABASE_URL" -v ON_ERROR_STOP=1 -f app/db/schema.sql

      - name: Run full automation audit
        run: bash automation/audit.sh full

      - name: Upload consistency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-reports
          path: |
            automation/reports/consistency_report.json
            automation/reports/consistency_report.md

  knowledge_m3_truth:
    name: knowledge-m3-truth-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify code gate works without legacy docs, then verify prose parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile automation/check_truth_governance_policy.py automation/check_truth_governance_documentation.py
          test -d docs
          mv docs docs.knowledge-m3-hidden
          trap 'if [ -d docs.knowledge-m3-hidden ]; then mv docs.knowledge-m3-hidden docs; fi' EXIT
          python3 automation/check_truth_governance_policy.py
          mv docs.knowledge-m3-hidden docs
          trap - EXIT
          python3 automation/check_truth_governance_documentation.py

