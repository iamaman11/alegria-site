name: rust-cache-prime

# Only trusted default-branch content may populate the compiler-object cache
# consumed read-only by PRs. No workflow_run/pull_request_target cache writer.
on:
  push:
    branches: [main]
    paths:
      - 'app/rust/**'
      - '.github/workflows/rust-cache-prime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-cache-prime-main
  cancel-in-progress: true

jobs:
  prime:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      SQLX_OFFLINE: "true"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_ERROR_LOG: /tmp/sccache-main-errors.log
      SCCACHE_LOG: sccache::server=debug
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout exact trusted main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify main source provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install native Rust build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Pin stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install shared Rust compiler-object cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Authorize sccache on trusted main only
        uses: actions/github-script@v8
        with:
          script: |
            const url = process.env.ACTIONS_RESULTS_URL;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!url || !token) {
              throw new Error('GitHub Actions cache service credentials are unavailable');
            }
            core.exportVariable('ACTIONS_RESULTS_URL', url);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);

      - name: Populate shared Cargo dependency sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Match the actual integration feature/profile and worker binaries used
      # by scoped PR E2Es. This is a non-gating, main-only warm-up, not a claim
      # that a fresh Rust PR itself finished in under five minutes.
      - name: Prime shared test and worker compilation units
        working-directory: app/rust
        run: |
          cargo test -p integration_harness --features e2e --lib --no-run --locked
          cargo build --locked -p temporal_worker -p outbox_worker \
            --bin temporal_worker --bin outbox_worker

      - name: Report main cache hits, misses and write errors
        if: always()
        run: sccache --show-stats

      - name: Classify cache failures without exposing tokens or service URLs
        if: always()
        run: python3 automation/report_sccache_failures.py --log "$SCCACHE_ERROR_LOG"
