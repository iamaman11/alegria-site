name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install Python quality tooling
        run: python3 -m pip install --disable-pip-version-check ruff==0.17.4

      - name: Install native audit/build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep protobuf-compiler

      - name: Rust formatting
        working-directory: app/rust
        run: cargo fmt --all -- --check

      - name: Repository architecture audit
        run: bash automation/audit.sh fast

      - name: Static-site publication contract
        run: python3 automation/check_static_site_builder_contract.py

      - name: Canonical Temporal launch certification contract (read-only smoke)
        run: |
          python3 automation/smoke_e2e_canonical_temporal.py
          python3 automation/smoke_e2e_publication_verdict.py
          python3 automation/smoke_e2e_first_site.py
          python3 automation/smoke_first_site_release.py
          python3 automation/smoke_integration_harness_image_contract.py

      - name: Rust workspace check
        working-directory: app/rust
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --locked

      - name: Rust workspace tests
        working-directory: app/rust
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --workspace --locked

  rust-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec audit
        working-directory: app/rust
        run: cargo audit

      # Read-only diagnostics run on audit failure. Keep the audit result
      # blocking; feature paths are required before changing Temporal/SQLx.
      - name: Diagnose vulnerable dependency feature paths
        if: failure()
        working-directory: app/rust
        run: |
          cargo tree --locked -e features -i ringbuf
          cargo tree --locked -e features -i rsa
          cargo tree --locked -e features -i sqlx-mysql

  cloudflare-static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install native cf static build dependencies
        run: npm install --prefix infra/cloudflare/seo-static --no-audit --no-fund
      - name: Offline Cloudflare publication boundary tests
        run: python3 automation/smoke_seo_cloudflare_deploy.py
      - name: Actual cf CLI build and asset preservation (no deployment)
        shell: bash
        working-directory: infra/cloudflare/seo-static
        run: |
          set -euo pipefail
          public="$(mktemp -d)"
          printf '<!doctype html><html><body><h1>Test</h1></body></html>\\n' > "$public/index.html"
          printf 'User-agent: *\\nDisallow: /\\n' > "$public/robots.txt"
          ALEGRIA_CF_PUBLIC_DIR="$public" ./node_modules/.bin/cf deploy --dry-run
          built=".cloudflare/output/v0/workers/default/assets/index.html"
          test -f "$built"
          cmp "$public/index.html" "$built"

  temporal-worker-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - name: Build the actual canonical Temporal worker image
        run: |
          docker build --progress=plain \
            -f app/rust/services/temporal/Dockerfile \
            -t alegria-seo-temporal:ci .
      - name: Verify the runtime image includes its native deploy tools
        run: |
          docker run --rm --entrypoint /bin/sh alegria-seo-temporal:ci -ec '
            command -v python3
            command -v node
            command -v temporal_worker
            command -v temporal_starter
            temporal_starter --help >/dev/null
            test -x /app/infra/cloudflare/seo-static/node_modules/.bin/cf
            test -f /app/infra/cloudflare/seo-static/vite.config.ts
            python3 -m py_compile /app/automation/deploy_seo_static_cloudflare.py
            python3 -m py_compile /app/automation/check_first_site_release.py
            test -f /app/automation/check_first_site_release.py
          '

  stack-temporal-postgres18:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate all Compose services and current image syntax
        run: docker compose config --quiet
      - name: Boot supported PostgreSQL 18 + Temporal 1.32 and initialize namespace
        run: |
          set -euo pipefail
          docker compose up -d temporal-namespace
          docker compose wait temporal-namespace
          test "$(docker inspect -f '{{.State.ExitCode}}' alegria_temporal_schema)" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' alegria_temporal_namespace)" = "0"
          docker compose run --rm --no-deps --entrypoint temporal temporal-namespace \
            operator namespace describe --namespace default --address temporal-server:7233
      - name: Keep failure evidence and clean only disposable CI volumes
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 temporal-schema temporal-server temporal-namespace || true
          docker compose down -v --remove-orphans

  stack-storage-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate upgraded persistent services as actual containers
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up -d --wait postgres pgbouncer neo4j qdrant
          docker compose exec -T postgres pg_isready -U postgres -d alegria
          test "$(docker compose exec -T -e PGPASSWORD=postgres_password postgres \
            psql -h pgbouncer -p 6432 -U postgres -d alegria -Atqc 'SELECT 1' | tr -d '\r')" = "1"
          docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_password \
            'RETURN 1 AS healthy'
          docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_password \
            'CALL gds.version() YIELD gdsVersion RETURN gdsVersion'
          curl --retry 12 --retry-delay 3 --retry-connrefused -fsS \
            http://127.0.0.1:6333/collections
      - name: Print version and errors, remove only disposable CI volumes
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 postgres pgbouncer neo4j qdrant || true
          docker compose down -v --remove-orphans
