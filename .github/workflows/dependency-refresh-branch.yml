name: dependency-refresh-branch

# Existing one-shot dependency resolver reused on the isolated stack-upgrade branch.
# Produces a REVIEWABLE Cargo.lock candidate; it does not deploy or merge.
on:
  push:
    branches: ["feature/upgrade-all-stack-20261108"]
    paths:
      - ".github/workflows/dependency-refresh-branch.yml"
      - "app/rust/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout exact upgrade branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Install protocol buffers compiler for generated Rust contracts
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Update resolved Rust dependencies
        working-directory: app/rust
        run: |
          cargo --version
          cargo update
          cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Commit dependency lock candidate to isolated draft branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add app/rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "LOCK_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rust): refresh dependency lock for latest stack candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trace vulnerability ancestry (diagnostic)
        working-directory: app/rust
        run: |
          cargo tree --locked -i ringbuf || true
          cargo tree --locked --target all -i rsa || true

      - name: Compile updated Rust workspace
        working-directory: app/rust
        run: cargo check --workspace --locked

      - name: Test updated Rust workspace
        working-directory: app/rust
        run: cargo test --workspace --locked

      - name: Compile integration harness
        working-directory: app/rust
        run: cargo test -p integration_harness --features e2e --no-run --locked

      - name: RustSec gate (still blocking)
        if: always()
        run: |
          cargo install cargo-audit --locked
          cd app/rust
          cargo audit
