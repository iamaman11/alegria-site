name: dependency-refresh-branch

# One-shot dependency resolution for the reviewed Draft CI/stack-upgrade branch.
# This resolver only commits Cargo.lock. The canonical PR CI owns compilation,
# security and tests of the resulting source SHA, avoiding duplicate work.
on:
  push:
    branches: ["codex/issue-37-modular-build"]
    paths:
      - ".github/workflows/dependency-refresh-branch.yml"
      - "app/rust/Cargo.toml"
      - "app/rust/crates/infrastructure/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout exact upgrade branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Update resolved Rust dependencies
        working-directory: app/rust
        run: |
          cargo --version
          cargo update
          cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Commit dependency lock candidate to isolated draft branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add app/rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "LOCK_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rust): refresh dependency lock for latest stack candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
