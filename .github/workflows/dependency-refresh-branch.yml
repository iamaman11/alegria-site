name: dependency-refresh-branch

# Manual dependency resolution for maintenance of the reviewed Draft branch.
# Do not auto-commit lock changes on every manifest edit: review and test an
# explicit Cargo.lock update via the canonical PR CI instead.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout exact upgrade branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Update resolved Rust dependencies
        working-directory: app/rust
        run: |
          cargo --version
          cargo update
          cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Commit dependency lock candidate to isolated draft branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add app/rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "LOCK_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rust): refresh dependency lock for latest stack candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
