name: worker-image

# Shipping the full Temporal/Cloudflare runtime is release work, not a PR test.
# Compile it once for the accepted main commit; keep no-build Windows staging.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: worker-image-${{ github.sha }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify requested commit identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up official Docker Buildx builder
        uses: docker/setup-buildx-action@v4

      - name: Build canonical Temporal Worker release image with persistent layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/rust/services/temporal/Dockerfile
          push: false
          load: true
          tags: alegria-seo-temporal:ci
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            by.alegria.source-head-sha=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=alegria-temporal-worker
          cache-to: type=gha,scope=alegria-temporal-worker,mode=max

      - name: Verify runtime includes its native deployment tools
        run: |
          docker run --rm --entrypoint /bin/sh alegria-seo-temporal:ci -ec '
            command -v python3
            command -v node
            command -v temporal_worker
            command -v temporal_starter
            temporal_starter --help >/dev/null
            test -x /app/infra/cloudflare/seo-static/node_modules/.bin/cf
            test -f /app/infra/cloudflare/seo-static/vite.config.ts
            python3 -m py_compile /app/automation/deploy_seo_static_cloudflare.py
            python3 -m py_compile /app/automation/check_first_site_release.py
            test -f /app/automation/check_first_site_release.py
          '

      - name: Archive exact image for no-build Windows staging
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/temporal-worker-artifact"
          mkdir -p "$artifact_dir"
          label="$(docker image inspect --format '{{index .Config.Labels "by.alegria.source-head-sha"}}' alegria-seo-temporal:ci)"
          test "$label" = "$SOURCE_SHA"
          docker save alegria-seo-temporal:ci | gzip -1 > "$artifact_dir/temporal-worker.tar.gz"
          (cd "$artifact_dir" && sha256sum temporal-worker.tar.gz > temporal-worker.tar.gz.sha256)
          docker image inspect --format '{{.Id}}' alegria-seo-temporal:ci > "$artifact_dir/image-id.txt"
          printf '%s\n' "$SOURCE_SHA" > "$artifact_dir/source-sha.txt"

      - name: Sign source-specific archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/temporal-worker-artifact/temporal-worker.tar.gz

      - name: Upload source-specific Worker image
        uses: actions/upload-artifact@v7
        with:
          name: temporal-worker-image-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/temporal-worker-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
