name: ci

on:
  pull_request:
  push:
    branches: [main]
  # One entry point: required PR CI, accepted-main image, explicit deep or lock refresh.
  workflow_dispatch:
    inputs:
      operation:
        description: Manual job to run (choose main for Worker image)
        required: true
        default: comprehensive
        type: choice
        options:
          - comprehensive
          - worker-image
          - dependency-refresh
          - physical-study
      expected_source_sha:
        description: Exact previously green Draft PR head SHA for a physical study
        required: false
        type: string
      physical_study:
        description: One optional compiler experiment; never required by the CI gate
        required: false
        default: compiler-owners
        type: choice
        options:
          - compiler-owners
          - coldwarm
          - pg-harness
          - owner-rebuild
          - dag-parent-ab
          - legacy-worker-split

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # Independent physical modes must not destroy each other's measurements.
  # PR synchronization still cancels an obsolete run for that one PR.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'automatic' }}-${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'physical-study' && inputs.physical_study || 'shared' }}
  cancel-in-progress: true

jobs:
  impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected_ci_jobs: ${{ steps.decide.outputs.selected_ci_jobs }}
      source_sha: ${{ steps.decide.outputs.source_sha }}
      cargo_scope: ${{ steps.decide.outputs.cargo_scope }}
      graph_e2e_shards: ${{ steps.decide.outputs.graph_e2e_shards }}
      qdrant_e2e_shards: ${{ steps.decide.outputs.qdrant_e2e_shards }}
      qdrant_temporal_e2e_shards: ${{ steps.decide.outputs.qdrant_temporal_e2e_shards }}
      pg_app_e2e_shards: ${{ steps.decide.outputs.pg_app_e2e_shards }}
      temporal_legacy_e2e_shards: ${{ steps.decide.outputs.temporal_legacy_e2e_shards }}
      temporal_v3_e2e_shards: ${{ steps.decide.outputs.temporal_v3_e2e_shards }}
      pg_e2e_shards: ${{ steps.decide.outputs.pg_e2e_shards }}
      outbox_e2e_shards: ${{ steps.decide.outputs.outbox_e2e_shards }}
      truth_e2e_shards: ${{ steps.decide.outputs.truth_e2e_shards }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Pin Rust for workspace metadata only
        uses: dtolnay/rust-toolchain@stable

      - name: Enforce source-document layout even when every owner is not applicable
        run: python3 automation/check_docs_layout.py

      - name: Refuse unsafe DataForSEO owner SQL privileges and mutable receipts
        run: python3 automation/check_dataforseo_sql_policy.py

      - name: Compute one exact-source Cargo, suite and job impact report
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          python3 automation/ci_impact.py --base "$PR_BASE_SHA" --head "$CI_HEAD_SHA" \
            --report automation/reports/ci_impact.json

      - name: Publish only validated job selections
        id: decide
        env:
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          sys.path.insert(0, 'automation')
          from ci_impact import (
              CI_PR_OWNERS, E2E_RUNNER_PARTITIONS,
              SCHEMA_VERSION, e2e_shard_commands_for_report,
          )

          output_keys = {
              'rust-graph-e2e': 'graph_e2e_shards',
              'rust-qdrant-e2e': 'qdrant_e2e_shards',
              'rust-qdrant-temporal-e2e': 'qdrant_temporal_e2e_shards',
              'rust-pg-app-e2e': 'pg_app_e2e_shards',
              'rust-temporal-legacy-e2e': 'temporal_legacy_e2e_shards',
              'rust-temporal-v3-e2e': 'temporal_v3_e2e_shards',
              'rust-pg-e2e': 'pg_e2e_shards',
              'rust-outbox-e2e': 'outbox_e2e_shards',
              'rust-truth-e2e': 'truth_e2e_shards',
          }
          if set(output_keys) != set(E2E_RUNNER_PARTITIONS):
              raise SystemExit('CI_IMPACT=FAIL physical runner partition mismatch')

          with open('automation/reports/ci_impact.json', encoding='utf-8') as f:
              report = json.load(f)
          selected = report.get('selected_ci_jobs')
          if (report.get('schema_version') != SCHEMA_VERSION
                  or report.get('mandatory_full_ci_gate') is not True
                  or report.get('scope') not in {'none', 'scoped', 'full'}
                  or report.get('source_sha') != os.environ['CI_HEAD_SHA']
                  or report.get('head_sha') != os.environ['CI_HEAD_SHA']
                  or subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['CI_HEAD_SHA']
                  or not isinstance(selected, list)
                  or len(set(selected)) != len(selected)
                  or any(name not in CI_PR_OWNERS for name in selected)
                  or (report['scope'] == 'full'
                      and not {'architecture-and-rust', 'verify'}.issubset(selected))
                  or any(report['ci_job_status'][name] != ('required' if name in selected else 'not_applicable')
                         for name in CI_PR_OWNERS)):
              raise SystemExit('CI_IMPACT=FAIL source/owner selection mismatch')
          if report['scope'] == 'full':
              shards = e2e_shard_commands_for_report(report)
              routes = {owner: [name for name in names if shards[name]]
                        for owner, names in E2E_RUNNER_PARTITIONS.items()}
              if any(not routes[owner] for owner in routes if owner != 'rust-truth-e2e'):
                  raise SystemExit('CI_IMPACT=FAIL full CI has no mandatory live E2E shards')
              truth_required = 'rust-truth-e2e' in selected
              if truth_required != bool(routes['rust-truth-e2e']):
                  raise SystemExit('CI_IMPACT=FAIL conditional Truth certification owner mismatch')
          else:
              # A valid singleton keeps GitHub's matrix expression well-typed
              # even when the job-level full-only condition skips the job.
              routes = {owner: ['not_applicable'] for owner in E2E_RUNNER_PARTITIONS}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('selected_ci_jobs=' + json.dumps(selected, separators=(',', ':')) + '\n')
              f.write('source_sha=' + os.environ['CI_HEAD_SHA'] + '\n')
              f.write('cargo_scope=' + report['scope'] + '\n')
              for owner, key in output_keys.items():
                  # Truth may be genuinely unselected in otherwise full CI;
                  # the job's skip condition must not hide missing mandatory
                  # test rows on any of the seven unconditional runners.
                  values = routes[owner] or ['not_applicable']
                  f.write(key + '=' + json.dumps(values, separators=(',', ':')) + '\n')
          print('CI_IMPACT=PASS selected=' + ','.join(selected))
          print('CI_E2E_SHARDS=PASS ' + ' '.join(owner + '=' + ','.join(names)
                                                   for owner, names in routes.items()))
          PY

      # Fast deterministic failures must precede all expensive Cargo runners.
      # The existing architecture/verify suites retain the same checks; this
      # gate only moves first detection to the already-required impact owner.
      - name: Reject Rust format and SDK boundary violations before compilation
        if: steps.decide.outputs.cargo_scope != 'none'
        run: |
          (cd app/rust && cargo fmt --all -- --check)
          python3 automation/check_rust_adapter_boundaries.py

      - name: Preserve selected and not-applicable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-owner-impact
          path: automation/reports/ci_impact.json
          if-no-files-found: ignore

  architecture-and-rust:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'architecture-and-rust')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
      # Release-like CI compiles use a shared compiler-object cache;
      # local developer builds retain incremental compilation.
      CARGO_INCREMENTAL: "0"
      # Cargo's default debug symbols are several GB of temporary output for
      # this 22-crate workspace. CI runs assertions/tests but never debugs the
      # resulting executable, so omit DWARF while keeping dev/test semantics.
      # Match trusted-main cache priming exactly to preserve sccache hits.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "on"
      # PR caches are isolated by merge ref. Reuse compiler objects created by
      # trusted main without uploading hundreds of PR-only entries or competing
      # for GitHub's per-repository cache-write rate limit. sccache 0.16 counts
      # read-only skips as write "errors"; the diagnostic distinguishes them.
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SCCACHE_ERROR_LOG: /tmp/sccache-pr-errors.log
      SCCACHE_LOG: sccache::server=debug
      RUSTC_WRAPPER: sccache
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          # Physical A/B reads the canonical PR head tree independently from
          # the synthetic merge checkout. Never replace the checked-out tree.
          git fetch --depth=1 origin "refs/pull/${CI_PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${CI_SOURCE_SHA}"

      - name: Install native audit/build tools
        run: bash automation/install_ci_native_tools.sh ripgrep protoc

      - name: Pin the same stable Rust toolchain as the verify job
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compiler outputs across independent target directories
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      # GitHub's cache URL and runtime token are present in action processes,
      # not automatically in the shell steps that invoke rustc/sccache. Follow
      # sccache's documented GHA setup; never print the token to job logs.
      - name: Authorize sccache against the GitHub Actions cache service
        uses: actions/github-script@v8
        with:
          script: |
            const url = process.env.ACTIONS_RESULTS_URL;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!url || !token) {
              throw new Error('GitHub Actions cache service credentials are unavailable');
            }
            core.exportVariable('ACTIONS_RESULTS_URL', url);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);

      - name: Rust formatting
        working-directory: app/rust
        run: cargo fmt --all -- --check

      - name: Regression-test fail-closed Rust impact and local developer feedback
        run: |
          python3 automation/check_ci_impact.py
          python3 automation/check_rust_ci_artifacts.py
          python3 automation/check_dev_rust_feedback.py
          python3 automation/check_owner_rebuild.py
          python3 automation/test_native_dag_owner_isolation.py
          python3 automation/check_physical_build_options.py
          python3 automation/test_measure_generic_temporal_rebuild.py
          python3 automation/check_temporal_activity_owner_inventory.py
          python3 automation/test_temporal_activity_owner_inventory.py
          python3 automation/check_reliability_contracts.py
          python3 automation/test_causal_revision_contract.py
          python3 automation/test_neo4j_schema_contract.py
          python3 automation/test_operation_freshness_contract.py
          python3 automation/test_v3_effect_owner_boundary.py

      - name: Regression-test fast CI timing and failure propagation
        run: |
          python3 automation/check_ci_phase_timing.py
          python3 automation/check_ci_merge_provenance.py
          python3 automation/check_cargo_feedback.py

      - name: Integration image boundary
        run: |
          python3 automation/smoke_integration_harness_image_contract.py
          python3 automation/check_temporal_docker_context.py

      # Only this owner publishes dependency sources. Three parallel writers to
      # the old 5.6-GB Cargo.lock/target key raced on a cache miss in CI #201.
      # Keep compiler-object reuse in sccache while measuring target-free runs.
      - name: Cache shared Cargo dependency sources (single writer)
        id: cargo_registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Determine directly changed Rust crates and dependent consumers
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          python3 automation/ci_impact.py \
            --base "$PR_BASE_SHA" \
            --head "$CI_HEAD_SHA" \
            --report automation/reports/ci_impact.json

      - name: Upload machine-readable Rust change impact report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-change-impact
          path: |
            automation/reports/ci_impact.json
          if-no-files-found: ignore

      # Validate the reduced workspace before the accepted-main release.
      # This compiles nothing and leaves PR image packaging disabled.
      - name: Verify dependency-scoped Worker release context resolves locked Cargo
        run: |
          python3 automation/prepare_worker_build_context.py \
            --source-sha "$(git rev-parse HEAD)" \
            --destination "$RUNNER_TEMP/alegria-worker-context"
          python3 automation/check_worker_dependency_skeleton.py \
            "$RUNNER_TEMP/alegria-worker-context/app/rust/Cargo.toml" \
            "$RUNNER_TEMP/alegria-worker-context/dependency-skeleton/app/rust/Cargo.toml"

      # Same impact report drives local and CI Cargo feedback. Full scope is
      # delegated to the independent mandatory verify/E2E jobs above.
      - name: Changed Rust crates and dependent consumers
        if: needs.impact.outputs.cargo_scope != 'full'
        env:
          SQLX_OFFLINE: "true"
        run: python3 automation/run_scoped_cargo_feedback.py --report automation/reports/ci_impact.json

      # Compile the independently deployed paid-provider owner, pure Temporal
      # Acquisition Child, raw-HTML source issuer and independently credentialed
      # one-step request issuer
      # as real executables in this already-required compiler job. Transfer
      # their exact SHA-bound bytes into the native Temporal E2E runner; no
      # second owner compilation in the E2E job.
      - name: Compile independent DataForSEO, pure Acquisition and source issuer binaries
        if: needs.impact.outputs.cargo_scope == 'full'
        env:
          SQLX_OFFLINE: "true"
        working-directory: app/rust
        run: cargo build --locked -p temporal_dataforseo -p temporal_acquisition_pure -p acquisition_source_issuer -p one_step_request_issuer --bins

      # Reuse the independently compiled owner as an exact-source artifact.
      # The pure Temporal/PG binary job must never recompile or transitively
      # link this provider SDK just to supply the physical E2E runner.
      - name: Pack isolated DataForSEO owner from its existing compile
        if: needs.impact.outputs.cargo_scope == 'full'
        run: |
          python3 automation/rust_ci_artifacts.py pack --kind dataforseo_effects --source-sha "$GITHUB_SHA" \
            --directory automation/reports/rust-ci-artifacts/dataforseo_effects

      - name: Publish independently compiled DataForSEO E2E artifact
        if: needs.impact.outputs.cargo_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: rust-e2e-dataforseo-effects-${{ github.sha }}
          path: automation/reports/rust-ci-artifacts/dataforseo_effects/
          if-no-files-found: error

      - name: Pack independent Acquisition owner for native E2E
        if: needs.impact.outputs.cargo_scope == 'full'
        run: |
          python3 automation/rust_ci_artifacts.py pack --kind acquisition_pure --source-sha "$GITHUB_SHA" \
            --directory automation/reports/rust-ci-artifacts/acquisition_pure

      - name: Publish independently compiled Acquisition E2E artifact
        if: needs.impact.outputs.cargo_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: rust-e2e-acquisition-pure-${{ github.sha }}
          path: automation/reports/rust-ci-artifacts/acquisition_pure/
          if-no-files-found: error

      # One extra typed issuer, built in the existing compiler job, never
      # linked into Temporal or the generic PostgreSQL effect owner.
      - name: Pack independently authenticated request-grant issuer
        if: needs.impact.outputs.cargo_scope == 'full'
        run: |
          python3 automation/rust_ci_artifacts.py pack --kind one_step_request_issuer --source-sha "$GITHUB_SHA" \
            --directory automation/reports/rust-ci-artifacts/one_step_request_issuer

      - name: Publish exact-source grant issuer for physical E2E
        if: needs.impact.outputs.cargo_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: rust-e2e-one-step-request-issuer-${{ github.sha }}
          path: automation/reports/rust-ci-artifacts/one_step_request_issuer/
          if-no-files-found: error

      - name: Publish Rust compiler cache hit/miss statistics
        if: always()
        run: sccache --show-stats

      - name: Classify cache write errors without publishing daemon logs
        if: always()
        run: python3 automation/report_sccache_failures.py --log "$SCCACHE_ERROR_LOG"

      - name: Measure Cargo dependency and compilation footprints
        if: always()
        run: python3 automation/report_ci_cargo_cache.py --job architecture-and-rust --registry-cache-hit '${{ steps.cargo_registry.outputs.cache-hit }}'

      - name: Upload Rust cache experiment measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-cache-architecture
          path: |
            automation/reports/cargo_cache_architecture-and-rust.json
            automation/reports/owner_rebuild_probe.json
            automation/reports/physical_owner_ab.json
            automation/reports/physical_coldwarm_ab.json
            app/rust/target/cargo-timings/cargo-timing*.html
          if-no-files-found: error

  # Independent exact-source Graph/Neo4j E2E compiler, no dependency on unrelated owners.
  rust-e2e-graph-harness:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'rust-e2e-graph-harness') && needs.impact.outputs.cargo_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install Rust test compiler dependencies
        run: bash automation/install_ci_native_tools.sh protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Authorize read-only Rust object cache
        uses: actions/github-script@v8
        with:
          script: |
            if (!process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error('Rust cache service credentials unavailable');
            }
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Load exact-source mandatory E2E suite selection
        uses: actions/download-artifact@v7
        with:
          name: ci-owner-impact
          path: automation/reports
      - name: Compile real Graph/Neo4j owner E2E test executable
        run: |
          python3 automation/run_scoped_cargo_feedback.py \
            --report automation/reports/ci_impact.json --compile-owner-harness graph_harness \
            --owner-harness-bundle-dir automation/reports/rust-ci-artifacts/graph_harness
      - name: Publish source-verified Graph/Neo4j E2E executable
        uses: actions/upload-artifact@v7
        with:
          name: rust-e2e-graph-harness-${{ github.sha }}
          path: automation/reports/rust-ci-artifacts/graph_harness/
          if-no-files-found: error


  # Independent exact-source Qdrant/PG E2E compiler, no dependency on unrelated owners.
  rust-e2e-qdrant-harness:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'rust-e2e-qdrant-harness') && needs.impact.outputs.cargo_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install Rust test compiler dependencies
        run: bash automation/install_ci_native_tools.sh protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Authorize read-only Rust object cache
        uses: actions/github-script@v8
        with:
          script: |
            if (!process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error('Rust cache service credentials unavailable');
            }
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Load exact-source mandatory E2E suite selection
        uses: actions/download-artifact@v7
        with:
          name: ci-owner-impact
          path: automation/reports
      - name: Compile real Qdrant/PG owner E2E test executable
        run: |
          python3 automation/run_scoped_cargo_feedback.py \
            --report automation/reports/ci_impact.json --compile-owner-harness qdrant_harness \
            --owner-harness-bundle-dir automation/reports/rust-ci-artifacts/qdrant_harness
      - name: Publish source-verified Qdrant/PG E2E executable
        uses: actions/upload-artifact@v7
        with:
          name: rust-e2e-qdrant-harness-${{ github.sha }}
          path: automation/reports/rust-ci-artifacts/qdrant_harness/
          if-no-files-found: error

  # Native Temporal + PG + Qdrant is a NEW physical test owner. Never force
  # existing REST Qdrant shards to await provider Worker compiler artifacts.
  rust-e2e-qdrant-temporal-harness:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'rust-e2e-qdrant-temporal-harness') && needs.impact.outputs.cargo_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install Rust test compiler dependencies
        run: bash automation/install_ci_native_tools.sh protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Authorize read-only Rust object cache
        uses: actions/github-script@v8
        with:
          script: |
            if (!process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error('Rust cache service credentials unavailable');
            }
