  # One optional physical study on a previously green, exact canonical PR SHA.
  # It never participates in the required PR gate, and cannot replace any of
  # mandatory real E2E checks. Reuse this existing job for expensive probes;
  # no diagnostic Cargo work executes inside a mandatory job.
  rust-pg-physical-ab:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'physical-study'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 0
      - name: Fail closed unless exact selected source already passed full PR CI
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        uses: actions/github-script@v8
        with:
          script: |
            const expected = process.env.EXPECTED_SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(expected)) {
              throw new Error('Physical study requires an exact 40-character source SHA');
            }
            const { execFileSync } = require('node:child_process');
            const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (actual !== expected) {
              throw new Error('Physical study checked-out source differs from selected exact SHA');
            }
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              head_sha: expected, event: 'pull_request', per_page: 100,
            });
            const accepted = data.workflow_runs.filter(run =>
              run.name === 'ci' && run.head_sha === expected &&
              run.status === 'completed' && run.conclusion === 'success');
            if (!accepted.length) {
              throw new Error('No previously successful PR CI run for exact source SHA');
            }
            const fullRunMarkers = [
              'CI', 'impact', 'verify', 'rust-e2e-temporal-harness',
              'rust-temporal-legacy-e2e (temporal_manual)', 'rust-pg-e2e (verify_d)',
              'rust-qdrant-temporal-e2e (temporal_qdrant)',
            ];
            let green = null;
            for (const run of accepted.slice(0, 5)) {
              const { data: result } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: run.id, per_page: 100,
              });
              if (result.total_count !== result.jobs.length) {
                throw new Error('Physical source attestation requires every PR CI job, not page one');
              }
              const completedJobs = new Set(result.jobs.filter(job =>
                job.conclusion === 'success').map(job => job.name));
              if (fullRunMarkers.every(name => completedJobs.has(name))) {
                green = run;
                break;
              }
            }
            if (!green) {
              throw new Error('Exact SHA has no previously green full-scope PR CI gate and real E2E jobs');
            }
            // Actions job.head_sha is the trigger's PR head, NOT a trusted
            // record of the synthetic merge checkout. This proves a prior
            // green PR run exists, not the equality of its tested Git tree.
            // Exact current checkout provenance is checked independently by
            // compare_physical_build_options.verify_pr_source_provenance().
            core.info(`PHYSICAL_STUDY_GREEN_PR_RUN=FOUND sha=${expected} run=${green.id} historical_checkout_tree=UNVERIFIED`);
      - run: bash automation/install_ci_native_tools.sh protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Install and identify GNU time for physical CPU and RSS evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y time
          /usr/bin/time --version
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Execute one selected optional physical study
        env:
          PHYSICAL_STUDY: ${{ inputs.physical_study }}
        run: |
          set -euo pipefail
          mkdir -p automation/reports
          case "$PHYSICAL_STUDY" in
            compiler-owners)
              python3 automation/compare_physical_build_options.py \
                --compiler-owners > automation/reports/physical_owner_ab.json
              ;;
            coldwarm)
              python3 automation/compare_physical_build_options.py \
                --compiler > automation/reports/physical_coldwarm_ab.json
              ;;
            pg-harness)
              python3 automation/compare_pg_v3_harness_build.py \
                --output automation/reports/pg_v3_harness_physical_ab.json --measure-resources
              python3 automation/check_pg_v3_harness_build.py \
                --report automation/reports/pg_v3_harness_physical_ab.json
              ;;
            owner-rebuild)
              RUSTC_WRAPPER=sccache python3 automation/measure_owner_rebuild.py
              ;;
            dag-parent-ab)
              python3 automation/measure_generic_temporal_rebuild.py \
                --output automation/reports/generic_parent_rebuild_ab.json
              ;;
            legacy-worker-split)
              python3 automation/measure_legacy_worker_split.py \
                --output automation/reports/legacy_worker_split_physical.json
              ;;
            *) echo "Unknown physical study kind" >&2; exit 2 ;;
          esac
      - name: Publish exact four-owner metrics as auditable text
        if: success() && (inputs.physical_study == 'compiler-owners' || inputs.physical_study == 'owner-rebuild')
        env:
          STUDY: ${{ inputs.physical_study }}
          STUDY_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [[ "$STUDY" == compiler-owners ]]; then
            report=automation/reports/physical_owner_ab.json
          else
            report=automation/reports/owner_rebuild_probe.json
          fi
          python3 automation/summarize_owner_build_evidence.py \
            --study "$STUDY" --source-sha "$STUDY_SOURCE_SHA" --report "$report"
      - name: Publish optional isolated build measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-pg-physical-ab-${{ inputs.physical_study }}-${{ inputs.expected_source_sha }}
          path: |
            automation/reports/pg_v3_harness_physical_ab.json
            automation/reports/physical_owner_ab.json
            automation/reports/physical_coldwarm_ab.json
            automation/reports/owner_rebuild_probe.json
            automation/reports/generic_parent_rebuild_ab.json
            automation/reports/legacy_worker_split_physical.json
          if-no-files-found: warn

  # Actual legacy and V3 Workers compile in parallel with the shared harness
  # and full workspace tests, not serially before their own E2E suites.
  rust-e2e-legacy-binaries:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'rust-e2e-legacy-binaries') && needs.impact.outputs.cargo_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - run: bash automation/install_ci_native_tools.sh protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - uses: actions/github-script@v8
        with:
          script: |
            if (!process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error('Rust cache service credentials unavailable');
            }
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      # One Cargo feature resolution and dependency build, three independent
      # binaries. No second historical Cargo invocation or new CI owner.
      - name: Compile canonical Worker, Outbox and historical Temporal in one Cargo pass
        working-directory: app/rust
        run: |
          cargo build --locked -p temporal_worker -p outbox_worker -p temporal_orchestrator \
            --bin temporal_worker --bin outbox_worker --bin temporal_orchestrator \
            --features temporal_orchestrator/legacy-qdrant-v1,temporal_orchestrator/legacy-workflows
      - name: Bind legacy executable artifacts to exact source
        run: |
          python3 automation/rust_ci_artifacts.py pack --kind legacy --source-sha "$GITHUB_SHA" \
            --directory automation/reports/rust-ci-artifacts/legacy
      - uses: actions/upload-artifact@v7
        with:
          name: rust-e2e-legacy-${{ github.sha }}
          path: automation/reports/rust-ci-artifacts/legacy/
          if-no-files-found: error
      - name: Bind historical replay executable to exact source
        run: |
          python3 automation/rust_ci_artifacts.py pack --kind legacy_qdrant_parent --source-sha "$GITHUB_SHA" \
            --directory automation/reports/rust-ci-artifacts/legacy_qdrant_parent
      - name: Prove historical Temporal replay modes reach actual History reading
        run: |
          set -euo pipefail
          missing_history="$RUNNER_TEMP/absent-temporal-history.json"
          legacy="automation/reports/rust-ci-artifacts/legacy_qdrant_parent/temporal_orchestrator_legacy_qdrant_v1"
          for mode in --replay-history --replay-effect-history --replay-v5-effect-history --replay-qdrant-effect-history; do
            if "$legacy" "$mode" "$missing_history" >"$RUNNER_TEMP/dag-legacy-mode.log" 2>&1; then
              echo "historical replay unexpectedly accepted absent server History $mode" >&2
              exit 1
            fi
            grep -F 'read actual Temporal history' "$RUNNER_TEMP/dag-legacy-mode.log"
          done
          echo 'CI_TEMPORAL_LEGACY_REPLAY=PASS modes=pure-v3,v4,v5,qdrant-v1'
      - uses: actions/upload-artifact@v7
        with:
