name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install native audit/build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep protobuf-compiler

      - name: Rust formatting
        working-directory: app/rust
        run: cargo fmt --all -- --check

      - name: Integration image boundary
        run: python3 automation/smoke_integration_harness_image_contract.py

      - name: Cache Rust workspace builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Rust workspace tests (includes compile)
        working-directory: app/rust
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --workspace --locked

      - name: Compile e2e-feature integration harness
        working-directory: app/rust
        env:
          SQLX_OFFLINE: "true"
        run: cargo test -p integration_harness --features e2e --no-run --locked

      - name: Rust migration and fact-verifier parity
        env:
          SQLX_OFFLINE: "true"
        run: |
          cargo run -q --locked --manifest-path app/rust/services/cli_tools/Cargo.toml -- \
            check-rust-migration-contract --root . \
            --report-json automation/reports/rust_migration_contract.rust.json
          cargo run -q --locked --manifest-path app/rust/services/cli_tools/Cargo.toml -- \
            check-fact-verifier-parity --root . \
            --report-json automation/reports/fact_verifier_parity.rust.json

  rust-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec audit
        working-directory: app/rust
        run: cargo audit

      # Read-only diagnostics run on audit failure. Keep the audit result
      # blocking; feature paths are required before changing Temporal/SQLx.
      - name: Diagnose vulnerable dependency feature paths
        if: failure()
        working-directory: app/rust
        run: |
          cargo tree --locked --target all -e features -i ringbuf || true
          cargo tree --locked --target all -e features -i rsa || true
          cargo tree --locked --target all -e features -i sqlx-mysql@0.8.6 || true
          cargo tree --locked --target all -e features -i sqlx-mysql@0.9.0 || true

  cloudflare-static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install native cf static build dependencies
        run: npm install --prefix infra/cloudflare/seo-static --no-audit --no-fund
      - name: Offline Cloudflare publication boundary tests
        run: python3 automation/smoke_seo_cloudflare_deploy.py
      - name: Actual cf CLI build and asset preservation (no deployment)
        shell: bash
        working-directory: infra/cloudflare/seo-static
        run: |
          set -euo pipefail
          public="$(mktemp -d)"
          printf '<!doctype html><html><body><h1>Test</h1></body></html>\\n' > "$public/index.html"
          printf 'User-agent: *\\nDisallow: /\\n' > "$public/robots.txt"
          ALEGRIA_CF_PUBLIC_DIR="$public" ./node_modules/.bin/cf deploy --dry-run
          built=".cloudflare/output/v0/workers/default/assets/index.html"
          test -f "$built"
          cmp "$public/index.html" "$built"

  temporal-worker-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - name: Build the actual canonical Temporal worker image
        run: |
          docker build --progress=plain \
            -f app/rust/services/temporal/Dockerfile \
            -t alegria-seo-temporal:ci .
      - name: Verify the runtime image includes its native deploy tools
        run: |
          docker run --rm --entrypoint /bin/sh alegria-seo-temporal:ci -ec '
            command -v python3
            command -v node
            command -v temporal_worker
            command -v temporal_starter
            temporal_starter --help >/dev/null
            test -x /app/infra/cloudflare/seo-static/node_modules/.bin/cf
            test -f /app/infra/cloudflare/seo-static/vite.config.ts
            python3 -m py_compile /app/automation/deploy_seo_static_cloudflare.py
            python3 -m py_compile /app/automation/check_first_site_release.py
            test -f /app/automation/check_first_site_release.py
          '

  stack-temporal-postgres18:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate all Compose services and current image syntax
        run: docker compose config --quiet
      - name: Boot supported PostgreSQL 18 + Temporal 1.32 and initialize namespace
        run: |
          set -euo pipefail
          docker compose up -d temporal-namespace
          docker compose wait temporal-namespace
          test "$(docker inspect -f '{{.State.ExitCode}}' alegria_temporal_schema)" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' alegria_temporal_namespace)" = "0"
          docker compose run --rm --no-deps --entrypoint temporal temporal-namespace \
            operator namespace describe --namespace default --address temporal-server:7233
      - name: Keep failure evidence and clean only disposable CI volumes
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 temporal-schema temporal-server temporal-namespace || true
          docker compose down -v --remove-orphans

  stack-storage-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate upgraded persistent services as actual containers
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up -d --wait postgres pgbouncer neo4j qdrant
          docker compose exec -T postgres pg_isready -U postgres -d alegria
          docker compose exec -T pgbouncer pgbouncer -V | grep -F '1.26.1'
          test "$(docker compose exec -T -e PGPASSWORD=postgres_password postgres \
            psql -h pgbouncer -p 6432 -U postgres -d alegria -Atqc 'SELECT 1' | tr -d '\r')" = "1"
          docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_password \
            'RETURN 1 AS healthy'
          docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_password \
            'CALL gds.version() YIELD gdsVersion RETURN gdsVersion'
          curl --retry 12 --retry-delay 3 --retry-connrefused -fsS \
            http://127.0.0.1:6333/collections
      - name: Print version and errors, remove only disposable CI volumes
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 postgres pgbouncer neo4j qdrant || true
          docker compose down -v --remove-orphans

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
      # Disposable integration database, never a production credential.
      DATABASE_URL: postgres://alegria_ci:alegria_ci_only@127.0.0.1:5432/alegria_ci
      # Only this disposable CI database may run scoped truth SQL smoke tests.
      ALEGRIA_SCOPED_TRUTH_TEST: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alegria_ci
          POSTGRES_PASSWORD: alegria_ci_only
          POSTGRES_DB: alegria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alegria_ci -d alegria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check ruff==0.17.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native audit/build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep protobuf-compiler

      - name: Initialize disposable integration schema
        run: |
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f app/db/schema.sql

      - name: Source contracts and policy
        run: bash automation/ci_verify.sh contracts

      - name: Product and truth invariants
        run: bash automation/ci_verify.sh product

      - name: Integration and consistency checks
        run: bash automation/ci_verify.sh integration

      - name: Render consistency report
        if: always()
        run: bash automation/audit.sh report

      - name: Upload consistency reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-reports
          path: |
            automation/reports/consistency_report.json
            automation/reports/consistency_report.md

  windows-operator-smoke:
    name: Native Windows first-site operator regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical GitHub source
        uses: actions/checkout@v7

      - name: Setup native Windows Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run native Windows-only staging regression
        shell: pwsh
        run: |
          python automation/check_windows_staging_rollback.py
          pwsh -NoProfile -NonInteractive -File automation/smoke_windows_staging_reconcile.ps1

  gate:
    name: CI
    if: always()
    needs:
      - architecture-and-rust
      - rust-security
      - cloudflare-static-build
      - temporal-worker-docker
      - stack-temporal-postgres18
      - stack-storage-graph
      - verify
      - windows-operator-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = {name: item["result"] for name, item in json.loads(os.environ["NEEDS_JSON"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          if not results or any(result != "success" for result in results.values()):
              print("CI_GATE=FAIL")
              sys.exit(1)
          print("CI_GATE=PASS")
          PY
