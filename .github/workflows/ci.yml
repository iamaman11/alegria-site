        run: |
          set -euo pipefail
          start_ms="$(< "$RUNNER_TEMP/rust-transfer-start-ms")"
          echo "CI_RUST_ARTIFACT_TRANSFER owner=pg shard=${{ matrix.shard }} elapsed_ms=$(( $(date +%s%3N) - start_ms ))"
          python3 automation/rust_ci_artifacts.py install \
            --kind pg_harness --source-sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/rust-ci-bundles/pg_harness"
          python3 automation/rust_ci_artifacts.py install \
            --kind v3 --source-sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/rust-ci-bundles/v3"
          python3 automation/rust_ci_artifacts.py install \
            --kind legacy_qdrant_parent --source-sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/rust-ci-bundles/legacy_qdrant_parent"
      - name: Execute exact selected PG V3 architecture shard
        if: matrix.shard == 'pg_temporal'
        run: |
          python3 automation/run_scoped_cargo_feedback.py \
            --report automation/reports/ci_impact.json --suite-job architecture-and-rust \
            --execute-precompiled-e2e --e2e-shard '${{ matrix.shard }}'
      - name: Execute exact selected PG V3 effect and pure-DAG shard
        if: matrix.shard == 'verify_d'
        run: |
          python3 automation/run_scoped_cargo_feedback.py \
            --report automation/reports/ci_impact.json --suite-job verify \
            --execute-precompiled-e2e --e2e-shard '${{ matrix.shard }}'

  # The nine A14 checks execute on their own runtime runner as soon as their
  # independent test compiler and real legacy worker binaries are ready.
  # They no longer wait for the broad harness or verify_b's unrelated checks.
  rust-outbox-e2e:
    name: rust-outbox-e2e (${{ matrix.shard }})
    needs: [impact, rust-e2e-outbox-harness, rust-e2e-legacy-binaries]
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'rust-outbox-e2e') && needs.impact.outputs.cargo_scope == 'full' && needs.rust-e2e-outbox-harness.result == 'success' && needs.rust-e2e-legacy-binaries.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.outbox_e2e_shards) }}
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Start exact-source Outbox transfer timer
        shell: bash
        run: date +%s%3N > "$RUNNER_TEMP/rust-transfer-start-ms"
      - uses: actions/download-artifact@v7
        with:
          name: ci-owner-impact
          path: automation/reports
      - uses: actions/download-artifact@v7
        with:
          name: rust-e2e-outbox-harness-${{ github.sha }}
          path: ${{ runner.temp }}/rust-ci-bundles/outbox_harness
      - uses: actions/download-artifact@v7
        with:
          name: rust-e2e-legacy-${{ github.sha }}
          path: ${{ runner.temp }}/rust-ci-bundles/legacy
      - name: Authenticate exact-source A14 test and real worker binaries
        shell: bash
        run: |
          set -euo pipefail
          start_ms="$(< "$RUNNER_TEMP/rust-transfer-start-ms")"
          echo "CI_RUST_ARTIFACT_TRANSFER owner=outbox shard=${{ matrix.shard }} elapsed_ms=$(( $(date +%s%3N) - start_ms ))"
          python3 automation/rust_ci_artifacts.py install \
            --kind outbox_harness --source-sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/rust-ci-bundles/outbox_harness"
          python3 automation/rust_ci_artifacts.py install \
            --kind legacy --source-sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/rust-ci-bundles/legacy"
      - name: Execute nine exact A14 PostgreSQL/Worker E2E checks
        run: |
          python3 automation/run_scoped_cargo_feedback.py \
            --report automation/reports/ci_impact.json --suite-job verify \
            --execute-precompiled-e2e --e2e-shard '${{ matrix.shard }}'

  rust-truth-e2e:
    name: rust-truth-e2e (${{ matrix.shard }})
    needs: [impact, rust-e2e-truth-harness, rust-e2e-legacy-binaries]
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'rust-truth-e2e') && needs.impact.outputs.cargo_scope == 'full' && needs.rust-e2e-truth-harness.result == 'success' && needs.rust-e2e-legacy-binaries.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.truth_e2e_shards) }}
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Start exact-source Truth transfer timer
        shell: bash
        run: date +%s%3N > "$RUNNER_TEMP/rust-transfer-start-ms"
      - uses: actions/download-artifact@v7
        with:
          name: ci-owner-impact
          path: automation/reports
      - uses: actions/download-artifact@v7
        with:
          name: rust-e2e-truth-harness-${{ github.sha }}
          path: ${{ runner.temp }}/rust-ci-bundles/harness
      - uses: actions/download-artifact@v7
        with:
          name: rust-e2e-legacy-${{ github.sha }}
          path: ${{ runner.temp }}/rust-ci-bundles/legacy
      - name: Authenticate exact-source Truth test and real worker binaries
        shell: bash
        run: |
          set -euo pipefail
          start_ms="$(< "$RUNNER_TEMP/rust-transfer-start-ms")"
          echo "CI_RUST_ARTIFACT_TRANSFER owner=truth shard=${{ matrix.shard }} elapsed_ms=$(( $(date +%s%3N) - start_ms ))"
          python3 automation/rust_ci_artifacts.py install \
            --kind harness --source-sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/rust-ci-bundles/harness"
          python3 automation/rust_ci_artifacts.py install \
            --kind legacy --source-sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/rust-ci-bundles/legacy"
      - name: Execute one exact Truth PostgreSQL/Worker E2E checks
        run: |
          python3 automation/run_scoped_cargo_feedback.py \
            --report automation/reports/ci_impact.json --suite-job auto \
            --execute-precompiled-e2e --e2e-shard '${{ matrix.shard }}'
  # Fast PR truth-policy acceptance. Full real-worker 16-fixture certification
  # remains callable through manual dispatch, not on every experimental PR.
  product-truth:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'product-truth')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Match the established Product/Truth Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Fast Product and truth invariants
        run: bash automation/measure_ci_phase.sh product bash automation/ci_fast_verify.sh product

      - name: Upload measured Product/Truth phase timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-phase-product
          path: automation/reports/ci_phase_timings.jsonl
          if-no-files-found: ignore

  rust-security:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'rust-security')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # Official RustSec release binary: a 6-MB download instead of compiling
      # cargo-audit from sources for ~196s on a fresh GitHub runner.
      - name: Install pinned RustSec release with verified SHA-256
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -t cargo-audit.XXXXXX.tgz)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -o "$archive" \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz
          printf '%s  %s\n' 'b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59' "$archive" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzOf "$archive" cargo-audit-x86_64-unknown-linux-gnu-v0.23.0/cargo-audit > "$HOME/.cargo/bin/cargo-audit"
          chmod 755 "$HOME/.cargo/bin/cargo-audit"
          cargo audit --version

      - name: RustSec audit
        working-directory: app/rust
        run: cargo audit

      # Read-only diagnostics run on audit failure. Keep the audit result
      # blocking; feature paths are required before changing Temporal/SQLx.
      - name: Diagnose vulnerable dependency feature paths
        if: failure()
        working-directory: app/rust
        run: |
          cargo tree --locked --target all -e features -i ringbuf || true
          cargo tree --locked --target all -e features -i rsa || true
          cargo tree --locked --target all -e features -i sqlx-mysql@0.8.6 || true
          cargo tree --locked --target all -e features -i sqlx-mysql@0.9.0 || true

  cloudflare-static-build:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'cloudflare-static-build')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install native cf static build dependencies
        run: npm install --prefix infra/cloudflare/seo-static --no-audit --no-fund
      - name: Install isolated siteArchitect MCP resource dependencies
        run: npm ci --prefix infra/cloudflare/site-architect-mcp --no-audit --no-fund
      - name: Check OAuth MCP resource types and negative admission contracts
        run: |
          npm run check --prefix infra/cloudflare/site-architect-mcp
          npm test --prefix infra/cloudflare/site-architect-mcp
      - name: Build remote MCP resource Worker without deployment
        run: npm run build --prefix infra/cloudflare/site-architect-mcp
      - name: Offline Cloudflare publication boundary tests
        run: python3 automation/smoke_seo_cloudflare_deploy.py
      - name: Actual cf CLI build and asset preservation (no deployment)
        shell: bash
        working-directory: infra/cloudflare/seo-static
        run: |
          set -euo pipefail
          public="$(mktemp -d)"
          printf '<!doctype html><html><body><h1>Test</h1></body></html>\\n' > "$public/index.html"
          printf 'User-agent: *\\nDisallow: /\\n' > "$public/robots.txt"
          ALEGRIA_CF_PUBLIC_DIR="$public" ./node_modules/.bin/cf deploy --dry-run
          built=".cloudflare/output/v0/workers/default/assets/index.html"
          test -f "$built"
          cmp "$public/index.html" "$built"

  stack-temporal-postgres18:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'stack-temporal-postgres18')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate all Compose services and current image syntax
        run: docker compose config --quiet
      - name: Boot supported PostgreSQL 18 + Temporal 1.32 and initialize namespace
        run: |
          set -euo pipefail
          docker compose up -d temporal-namespace
          docker compose wait temporal-namespace
          test "$(docker inspect -f '{{.State.ExitCode}}' alegria_temporal_schema)" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' alegria_temporal_namespace)" = "0"
          docker compose run --rm --no-deps --entrypoint temporal temporal-namespace \
            operator namespace describe --namespace default --address temporal-server:7233
      - name: Keep failure evidence and clean only disposable CI volumes
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 temporal-schema temporal-server temporal-namespace || true
          docker compose down -v --remove-orphans

  stack-storage-graph:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'stack-storage-graph')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate upgraded persistent services as actual containers
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up -d --wait postgres pgbouncer neo4j qdrant
          docker compose exec -T postgres pg_isready -U postgres -d alegria
          docker compose exec -T pgbouncer pgbouncer -V | grep -F '1.26.1'
          test "$(docker compose exec -T -e PGPASSWORD=postgres_password postgres \
            psql -h pgbouncer -p 6432 -U postgres -d alegria -Atqc 'SELECT 1' | tr -d '\r')" = "1"
          docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_password \
            'RETURN 1 AS healthy'
          docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_password \
            'CALL gds.version() YIELD gdsVersion RETURN gdsVersion'
          curl --retry 12 --retry-delay 3 --retry-connrefused -fsS \
            http://127.0.0.1:6333/collections
      - name: Print version and errors, remove only disposable CI volumes
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 postgres pgbouncer neo4j qdrant || true
          docker compose down -v --remove-orphans

  verify:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'verify')
    runs-on: ubuntu-latest
    # A cold compiler cache may exceed the warmed five-minute CI target.
    timeout-minutes: 30
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SCCACHE_ERROR_LOG: /tmp/sccache-verify-errors.log
      SCCACHE_LOG: sccache::server=debug
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check ruff==0.17.6

      - name: Install lightweight Python policy tool
        run: bash automation/install_ci_native_tools.sh ripgrep

      - name: Fast source contracts and policy
        if: needs.impact.outputs.cargo_scope != 'full'
        run: bash automation/measure_ci_phase.sh contracts bash automation/ci_fast_verify.sh contracts

      - name: Fast integration and consistency checks
        if: needs.impact.outputs.cargo_scope != 'full'
        run: bash automation/measure_ci_phase.sh integration bash automation/ci_fast_verify.sh integration

      # Only broad/unclassifiable changes require the whole Rust workspace.
      # The existing verification owner runs its unit tests concurrently with
      # architecture's Worker binaries and real PostgreSQL/Temporal E2E suites.
      - name: Install native Rust test build dependencies
        if: needs.impact.outputs.cargo_scope == 'full'
        run: bash automation/install_ci_native_tools.sh protoc

      - name: Pin Rust for full workspace tests
        if: needs.impact.outputs.cargo_scope == 'full'
        uses: dtolnay/rust-toolchain@stable

      - name: Reuse trusted main Rust compiler objects for full workspace tests
        if: needs.impact.outputs.cargo_scope == 'full'
        id: verify_sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Authorize full-scope Rust cache reads
        if: needs.impact.outputs.cargo_scope == 'full'
        uses: actions/github-script@v8
        with:
          script: |
            const url = process.env.ACTIONS_RESULTS_URL;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!url || !token) {
              throw new Error('GitHub Actions cache service credentials are unavailable');
            }
            core.exportVariable('ACTIONS_RESULTS_URL', url);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);

      - name: Restore shared Cargo dependency sources without a second writer
        if: needs.impact.outputs.cargo_scope == 'full'
        id: rust_registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # The full-scope Rust tests used to wait for both Python policy phases.
      # They are independent read-only source checks, so run both owners on
      # this *same* runner concurrently, still wait and fail for either result.
      # No extra runner, cache writer or skipped test is introduced.
      - name: Full workspace Rust tests and both mandatory policy phases
        if: needs.impact.outputs.cargo_scope == 'full'
        env:
          SQLX_OFFLINE: "true"
          RUSTC_WRAPPER: sccache
        shell: bash
        run: |
          set -uo pipefail
          (
            set -euo pipefail
            bash automation/measure_ci_phase.sh contracts bash automation/ci_fast_verify.sh contracts
            bash automation/measure_ci_phase.sh integration bash automation/ci_fast_verify.sh integration
          ) &
          policy_pid=$!
          (
            set -euo pipefail
            cd app/rust
            cargo test --workspace --locked
          ) &
          rust_pid=$!
          wait "$policy_pid"
          policy_result=$?
          wait "$rust_pid"
          rust_result=$?
          printf 'CI_VERIFY_PARALLEL policy_exit=%s rust_exit=%s\n' "$policy_result" "$rust_result"
          if [[ "$policy_result" -ne 0 || "$rust_result" -ne 0 ]]; then
            exit 1
          fi

      # The independent rust-verify-e2e job consumes the ONE shared, hashed
      # integration harness instead of recompiling it after workspace tests.
      # The original `verify` owner keeps all unit and source-policy gates.

      - name: Full-scope compiler cache statistics
        if: always() && needs.impact.outputs.cargo_scope == 'full' && steps.verify_sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Classify full-scope Rust cache failures
        if: always() && needs.impact.outputs.cargo_scope == 'full' && steps.verify_sccache.outcome == 'success'
        run: python3 automation/report_sccache_failures.py --log "$SCCACHE_ERROR_LOG"

      - name: Upload measured Contracts/Integration phase timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-phase-verify
          path: |
            automation/reports/ci_phase_timings.jsonl
          if-no-files-found: ignore

      - name: Render consistency report
        if: always()
        run: bash automation/audit.sh report

      - name: Upload consistency reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-reports
          path: |
            automation/reports/consistency_report.json
            automation/reports/consistency_report.md

  windows-operator-smoke:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.selected_ci_jobs), 'windows-operator-smoke')
    name: Native Windows first-site operator regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical GitHub source
        uses: actions/checkout@v7

      - name: Setup native Windows Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run native Windows-only staging regression
        shell: pwsh
        run: |
          python automation/check_windows_staging_rollback.py
          pwsh -NoProfile -NonInteractive -File automation/smoke_windows_staging_reconcile.ps1
          pwsh -NoProfile -NonInteractive -File automation/smoke_windows_staging_image_artifact.ps1

  gate:
    name: CI
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'worker-image' && github.ref == 'refs/heads/main'))
    needs:
      - impact
      - architecture-and-rust
      - rust-e2e-graph-harness
      - rust-e2e-qdrant-harness
      - rust-e2e-qdrant-temporal-harness
      - rust-e2e-pg-app-harness
      - rust-e2e-temporal-harness
      - rust-e2e-pg-harness
      - rust-e2e-outbox-harness
      - rust-e2e-truth-harness
      - rust-e2e-legacy-binaries
      - rust-e2e-v3-binaries
      - rust-e2e-qdrant-effects-binaries
      - rust-graph-e2e
      - rust-qdrant-e2e
      - rust-qdrant-temporal-e2e
      - rust-pg-app-e2e
      - rust-temporal-legacy-e2e
      - rust-temporal-v3-e2e
      - rust-pg-e2e
      - rust-outbox-e2e
      - rust-truth-e2e
      - product-truth
      - rust-security
      - cloudflare-static-build
      - stack-temporal-postgres18
      - stack-storage-graph
      - verify
      - windows-operator-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CI plan owner registry
        # The protected main provenance script imports the SAME checked-out
        # registry for matrix shard names. No compilation or release rebuild.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Require every mandatory job to succeed
        if: github.event_name == 'pull_request'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_CI_JOBS: ${{ needs.impact.outputs.selected_ci_jobs }}
          CI_PLAN_SHA: ${{ needs.impact.outputs.source_sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, 'automation')
          from ci_impact import CI_PR_OWNERS

          results = {name: item["result"] for name, item in json.loads(os.environ["NEEDS_JSON"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          try:
              selected = json.loads(os.environ['SELECTED_CI_JOBS'])
          except (ValueError, TypeError):
              selected = None
          if (os.environ['CI_PLAN_SHA'] != os.environ['CI_HEAD_SHA']
                  or not isinstance(selected, list)
                  or len(set(selected)) != len(selected)
                  or any(name not in CI_PR_OWNERS for name in selected)
                  or set(results) != set(CI_PR_OWNERS) | {'impact'}
                  or results.get('impact') != 'success'
                  or any(results[name] != ('success' if name in selected else 'skipped')
                         for name in CI_PR_OWNERS)):
              print("CI_GATE=FAIL")
              sys.exit(1)
          print("CI_GATE=PASS")
          PY

      # No extra matrix, cache writer, or hidden after-gate suite: this is a
      # read-only REST snapshot of the very jobs the existing gate waited for.
      # It never substitutes elapsed estimates for the three real <=180s runs.
      - name: Report measured PR compiler-to-E2E critical paths
        if: github.event_name == 'pull_request' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          CI_CHECKOUT_SHA: ${{ github.sha }}
        run: python3 automation/report_ci_critical_path.py

      - name: Verify main merge comes from a fully successful PR CI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'worker-image')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          repo = os.environ["REPO_NAME"]
          merge_sha = os.environ["MERGE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          expected_jobs = {
              "impact",
              "architecture-and-rust", "rust-e2e-graph-harness", "rust-e2e-qdrant-harness",
              "rust-e2e-qdrant-temporal-harness", "rust-e2e-qdrant-effects-binaries",
              "rust-e2e-pg-app-harness", "rust-e2e-temporal-harness",
              "rust-e2e-pg-harness", "rust-e2e-outbox-harness", "rust-e2e-truth-harness",
              "rust-e2e-legacy-binaries",
              "rust-e2e-v3-binaries",
              "product-truth", "rust-security", "cloudflare-static-build",
              "stack-temporal-postgres18",
              "stack-storage-graph", "verify",
              "Native Windows first-site operator regression", "CI",
          }
          # Matrix job display names, not only their parent job IDs, are
          # reported by the GitHub REST API. An accepted source CI must have
          # every generated shard green. The exact selected subset is computed
          # and checked by the immutable same-source PR impact/gate scripts.
          sys.path.insert(0, 'automation')
          from ci_impact import E2E_RUNNER_PARTITIONS
          matrix_owners = {owner: set(shards) for owner, shards in E2E_RUNNER_PARTITIONS.items()}

          def fetch(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "alegria-merge-provenance",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as result:
                  return json.load(result)

          def require(condition, reason):
              if not condition:
                  sys.exit(f"CI_GATE=FAIL {reason}")

          commit = fetch(f"commits/{merge_sha}")
          parents = [parent["sha"] for parent in commit["parents"]]
          require(len(parents) == 2, "main commit must be a two-parent GitHub PR merge")
          source_sha = parents[1]
          # GitHub may index the commit->PR association a few seconds after
          # the main push. Do not weaken provenance: retry this single lookup
          # for up to 30 seconds and still fail closed on a missing/mismatched PR.
          for attempt in range(11):
              pull_requests = fetch(f"commits/{merge_sha}/pulls")
              matches = [
                  pr for pr in pull_requests
                  if pr["merged_at"] and pr["merge_commit_sha"] == merge_sha
                  and pr["head"]["sha"] == source_sha and pr["base"]["ref"] == "main"
              ]
              if len(matches) == 1 or attempt == 10:
                  break
              time.sleep(3)
          require(len(matches) == 1, "merge commit does not match one accepted PR head")
          merge_tree = fetch(f"git/commits/{merge_sha}")["tree"]["sha"]
          source_tree = fetch(f"git/commits/{source_sha}")["tree"]["sha"]
          require(merge_tree == source_tree, "merge tree differs from fully tested PR source tree")
          runs = fetch(f"actions/runs?head_sha={source_sha}&per_page=100")["workflow_runs"]
          accepted = [
              run for run in runs
              if run["head_sha"] == source_sha and run["event"] == "pull_request"
              and run["name"] == "ci" and run["status"] == "completed"
              and run["conclusion"] == "success"
          ]
          require(bool(accepted), "exact source PR head has no successful full CI")
          accepted.sort(key=lambda run: run["id"], reverse=True)
          run = accepted[0]
          results = {
              job["name"]: job["conclusion"]
              for job in fetch(f"actions/runs/{run['id']}/jobs?per_page=100")["jobs"]
          }
          # The exact-head PR CI gate already validated each skipped job
          # against its signed-by-source impact output. A missing owner or an
          # unvalidated failed job must never become a main release PASS.
          require(results.get('impact') == 'success' and results.get('CI') == 'success',
                  'source PR impact selector or aggregate gate did not pass')
          require(
              all(results.get(job) in {'success', 'skipped'} for job in expected_jobs),
              "source PR full CI did not pass every mandatory owner",
          )
          for owner, known_shards in matrix_owners.items():
              prefix = owner + ' ('
              expanded = {
                  name: conclusion for name, conclusion in results.items()
                  if name.startswith(prefix)
              }
              if expanded:
                  require(owner not in results, f"{owner} mixes skipped base and expanded shards")
                  # GitHub can materialize a job-level skipped matrix as its
                  # unevaluated display name instead of the base job ID. Such
                  # a skipped owner is valid only because the accepted exact-
                  # source PR gate already required selected owners to pass.
                  if set(expanded) in ({owner + ' ()'}, {owner + ' (not_applicable)'}):
                      require(set(expanded.values()) == {'skipped'},
                              f"{owner} declared a non-applicable shard as executed")
                  else:
                      require(all(name.endswith(')') and name[len(prefix):-1] in known_shards
                                  for name in expanded), f"{owner} has an unrecognized E2E shard")
                      require(len(expanded) == len({name[len(prefix):-1] for name in expanded}),
                              f"{owner} has duplicate E2E shards")
                      require(all(conclusion == 'success' for conclusion in expanded.values()),
                              f"{owner} did not pass all selected E2E shards")
              else:
                  require(results.get(owner) == 'skipped',
                          f"{owner} has neither selected shards nor an explicit scoped skip")
          print(f"CI_GATE=PASS merge={merge_sha} pr={matches[0]['number']} source={source_sha} full_ci={run['id']}")
          PY

  # Opt-in full-stack acceptance, never on a PR or an ordinary main push.
  # Scoped PR tests and the aggregate CI gate above do not depend on this job.
  comprehensive:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'comprehensive'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Same Cargo target for workspace units and real PostgreSQL regressions.
      TRUTH_CERT_SUITE_TARGET_DIR: ${{ github.workspace }}/app/rust/target
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
      DATABASE_URL: postgres://alegria_ci:alegria_ci_only@127.0.0.1:5432/alegria_ci
      ALEGRIA_SCOPED_TRUTH_TEST: "true"
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: alegria_ci
          POSTGRES_PASSWORD: alegria_ci_only
          POSTGRES_DB: alegria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alegria_ci -d alegria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Preflight publication source contract
        run: python3 automation/smoke_incremental_publish_path.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install full regression tooling
        run: |
          bash automation/install_ci_native_tools.sh ripgrep protoc
          sudo apt-get install -y postgresql-client
          python -m pip install --disable-pip-version-check ruff==0.17.6
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f app/db/schema.sql

      - name: Workspace unit tests
        working-directory: app/rust
        run: cargo test --workspace --locked

      - name: All retained-source/editorial PostgreSQL regressions
        working-directory: app/rust
        run: |
          cargo test -p integration_harness --features e2e --locked --lib retained_corpus_reuses_exact_paid_result_and_raw_pages_without_acquisition
          cargo test -p integration_harness --features e2e --locked --lib retained_raw_retrieval_requires_prior_receipts_and_exact_current_page_points
          cargo test -p integration_harness --features e2e --locked --lib changed_editorial_request_supersedes_only_pending_same_page_task
          cargo test -p integration_harness --features e2e --locked --lib cms_revision_
          cargo test -p integration_harness --features e2e --locked --lib content_gap_owner_identity_is_idempotent_and_independently_resolved
          cargo test -p integration_harness --features e2e --locked --lib keyword_cluster_natural_owner_survives_changed_serp_family

      - name: Full product truth, service integration, contracts and Rust-backed checks
        run: bash automation/ci_verify.sh all

      - name: Rust compiler cache statistics
        if: always()
        run: sccache --show-stats

      - name: Preserve deep regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-ci-evidence
          path: |
            automation/reports/ci_phase_timings.jsonl
            automation/reports/consistency_report.json
          if-no-files-found: ignore

  # Compiler objects can be written only from an accepted main merge.
  # This remains INSIDE the single CI workflow; PRs consume cache read-only.
  rust-cache-prime:
    needs: gate
    # A successful aggregate CI has intentionally skipped PR-only ancestors.
    # Override GitHub's implicit success() while still requiring gate=success.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      # Identical compile profiles on accepted main and read-only PR workers.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Controlled warm-cache experiment: #405 completed 69/69 writes without
      # rate limiting. Use three compiler slots; preserve sccache diagnostics
      # and restore two if real main runs show HTTP 429 or slower wall time.
      CARGO_BUILD_JOBS: "3"
      SQLX_OFFLINE: "true"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_ERROR_LOG: /tmp/sccache-main-errors.log
      SCCACHE_LOG: sccache::server=debug
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout exact trusted main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify main source and select cache-relevant changes
        id: cache_scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, 'automation')
          from ci_impact import changed_paths, main_cache_prime_required

          # Same rename-aware source diff as PR impact and Worker packaging.
          # Test-only harness inputs do not prime the compiler a second time.
          changed = changed_paths(os.environ['BEFORE_SHA'], os.environ['SOURCE_SHA'])
          needed = main_cache_prime_required(changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('needed=' + str(needed).lower() + '\n')
          print('MAIN_CACHE_PRIME=' + ('SELECTED cached Rust compilation input changed'
                                       if needed else 'SKIPPED no cached Rust compilation input changed'))
          PY

      - name: Install native Rust build dependencies
        if: steps.cache_scope.outputs.needed == 'true'
        run: bash automation/install_ci_native_tools.sh protoc

      - name: Pin stable Rust toolchain
        if: steps.cache_scope.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install shared Rust compiler-object cache
        if: steps.cache_scope.outputs.needed == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Authorize sccache on trusted main only
        if: steps.cache_scope.outputs.needed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const url = process.env.ACTIONS_RESULTS_URL;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!url || !token) {
              throw new Error('GitHub Actions cache service credentials are unavailable');
            }
            core.exportVariable('ACTIONS_RESULTS_URL', url);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);

      - name: Populate shared Cargo dependency sources
        if: steps.cache_scope.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Reuse the PR's exact-source Cargo graph and suite owners. Prime only
      # cacheable library objects, not the previously tested binaries/harness
      # executables that sccache cannot reuse. Unknown/global changes retain
      # full affected-library coverage. Only trusted main writes this cache.
      - name: Select exact-source Cargo compiler units
        if: steps.cache_scope.outputs.needed == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 automation/ci_impact.py \
            --base "$BEFORE_SHA" \
            --head "$SOURCE_SHA" \
            --report automation/reports/main_cache_prime_impact.json

      - name: Prime affected reusable Rust library objects
        if: steps.cache_scope.outputs.needed == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 automation/run_main_cache_prime.py \
            --base-sha "$BEFORE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --report automation/reports/main_cache_prime_impact.json

      - name: Report main cache hits, misses and write errors
        if: always() && steps.cache_scope.outputs.needed == 'true'
        run: sccache --show-stats

      - name: Classify cache failures without exposing tokens or service URLs
        if: always() && steps.cache_scope.outputs.needed == 'true'
        run: python3 automation/report_sccache_failures.py --log "$SCCACHE_ERROR_LOG"

  # Source-specific release packaging is part of this SAME workflow. It starts
  # only after the accepted-main CI provenance gate; PRs never build an image.
  select-image:
    needs: gate
    # PR-only ancestors are deliberately skipped on main; gate itself must pass.
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'worker-image' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      worker_required: ${{ steps.select.outputs.worker_required }}
      cache_export_required: ${{ steps.select.outputs.cache_export_required }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      MANUAL_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'worker-image' }}
    steps:
      - name: Checkout exact accepted main source and first parent
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2

      - name: Verify exact release source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Pin Cargo metadata toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Select Worker image through the shared impact owner registry
        id: select
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          python3 automation/ci_impact.py \
            --base "$base_sha" --head "$SOURCE_SHA" \
            --report automation/reports/worker_image_impact.json
          python3 - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, 'automation')
          from ci_impact import SCHEMA_VERSION, changed_paths, worker_release_decision

          with open('automation/reports/worker_image_impact.json', encoding='utf-8') as f:
              report = json.load(f)
          source = os.environ['SOURCE_SHA']
          if (report.get('schema_version') != SCHEMA_VERSION
                  or report.get('mandatory_full_ci_gate') is not True
                  or report.get('source_sha') != source
                  or report.get('head_sha') != source):
              raise SystemExit('WORKER_IMAGE_SELECTION=FAIL source/owner/report mismatch')

          # Use the same rename-aware path set as the source-bound impact
          # report; --name-only drops a renamed file's old path and breaks
          # exact-source Worker selection after a perfectly valid PR merge.
          changed = changed_paths('HEAD^1', source)
          # PR validation can be fail-closed FULL without changing any input
          # actually delivered inside the Worker image. One impact owner
          # decides the release; unknown or mixed inputs still rebuild.
          report['worker_release_decision'] = worker_release_decision(
              report, changed, manual=os.environ['MANUAL_PACKAGE'] == 'true',
          )
          decision = report['worker_release_decision']
          print('WORKER_IMAGE_SELECTION=' + ('SELECTED' if decision['worker_required'] else 'SKIPPED'))
          print('WORKER_IMAGE_REASON=' + decision['reason'])
          print('WORKER_CACHE_EXPORT=' + ('REQUIRED' if decision['cache_export_required'] else 'SKIPPED'))
          with open('automation/reports/worker_image_impact.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, indent=2, sort_keys=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('worker_required=' + str(decision['worker_required']).lower() + '\n')
              f.write('cache_export_required=' + str(decision['cache_export_required']).lower() + '\n')
          PY

      - name: Preserve image-selection evidence even when packaging is unnecessary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-image-impact-${{ env.SOURCE_SHA }}
          path: automation/reports/worker_image_impact.json
          if-no-files-found: ignore

  package:
    needs: [gate, select-image]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' && needs.select-image.result == 'success' &&
      needs.select-image.outputs.worker_required == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'worker-image')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact accepted main source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify requested commit identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Pin Rust for exact Cargo dependency metadata
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare exact-source dependency-scoped Worker Docker context
        env:
          RELEASE_CONTEXT: ${{ runner.temp }}/alegria-worker-context
        run: |
          python3 automation/prepare_worker_build_context.py \
            --source-sha "$SOURCE_SHA" --destination "$RELEASE_CONTEXT"

      - name: Set up official Docker Buildx builder
        uses: docker/setup-buildx-action@v4

      - name: Build canonical Temporal Worker release image with persistent layers
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/alegria-worker-context
          file: ${{ github.workspace }}/app/rust/services/temporal/Dockerfile
          push: false
          load: true
          tags: alegria-seo-temporal:ci
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            by.alegria.source-head-sha=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=alegria-temporal-worker
          # The previous successful image already cached the entire native
          # builder for assets-only changes. Rebasing assets does not change
          # Cargo objects or Node dependencies, so skip a redundant multi-GB
          # max-mode export. Any changed compiled source, dependency, Docker
          # recipe, unknown input or explicit rebuild exports the cache for
          # future source and asset releases. Keep cache-from and runtime
          # startup/source verification unchanged even when export is skipped.
          cache-to: ${{ needs.select-image.outputs.cache_export_required == 'true' && 'type=gha,scope=alegria-temporal-worker,mode=max,compression=zstd,compression-level=1' || '' }}

      - name: Verify runtime startup, source identity and native deployment tools
        run: |
          docker run --rm -e SOURCE_SHA --entrypoint /bin/sh alegria-seo-temporal:ci -ec '
            command -v python3
            command -v node
            command -v temporal_worker
            command -v temporal_starter
            temporal_starter --help >/dev/null
            # Execute the real Worker binary through its earliest expected
            # configuration boundary, without starting network services.
            if output="$(env -u DATABASE_URL temporal_worker 2>&1)"; then
              echo "unexpected Worker startup without DATABASE_URL" >&2
              exit 1
            fi
            case "$output" in
              *"DATABASE_URL must be set"*) ;;
              *) printf "%s\n" "$output" >&2; exit 1 ;;
            esac
            test -x /app/infra/cloudflare/seo-static/node_modules/.bin/cf
            test -f /app/infra/cloudflare/seo-static/vite.config.ts
            python3 -m py_compile /app/automation/deploy_seo_static_cloudflare.py
            python3 -m py_compile /app/automation/check_first_site_release.py
            test -f /app/automation/check_first_site_release.py
            test -f /app/worker-context.json
            python3 -c "import json, os; assert json.load(open(\"/app/worker-context.json\"))[\"source_sha\"] == os.environ[\"SOURCE_SHA\"]"
          '

      - name: Archive exact image for no-build Windows staging
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/temporal-worker-artifact"
          mkdir -p "$artifact_dir"
          label="$(docker image inspect --format '{{index .Config.Labels "by.alegria.source-head-sha"}}' alegria-seo-temporal:ci)"
          test "$label" = "$SOURCE_SHA"
          docker save alegria-seo-temporal:ci | gzip -1 > "$artifact_dir/temporal-worker.tar.gz"
          (cd "$artifact_dir" && sha256sum temporal-worker.tar.gz > temporal-worker.tar.gz.sha256)
          docker image inspect --format '{{.Id}}' alegria-seo-temporal:ci > "$artifact_dir/image-id.txt"
          printf '%s\n' "$SOURCE_SHA" > "$artifact_dir/source-sha.txt"

      - name: Sign source-specific archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/temporal-worker-artifact/temporal-worker.tar.gz

      - name: Upload source-specific Worker image
        uses: actions/upload-artifact@v7
        with:
          name: temporal-worker-image-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/temporal-worker-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # A manual lockfile refresh is also a mode of this single workflow. It may
  # update only a reviewed non-main branch; its candidate still needs PR CI.
  dependency-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'dependency-refresh' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout exact upgrade branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Update resolved Rust dependencies
        working-directory: app/rust
        run: |
          cargo --version
          cargo update
          cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Commit dependency lock candidate to isolated draft branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add app/rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "LOCK_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rust): refresh dependency lock for latest stack candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
