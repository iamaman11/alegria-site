name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-rust:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
      # Release-like CI compiles use a shared compiler-object cache;
      # local developer builds retain incremental compilation.
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${CI_SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"

      - name: Install native audit/build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep protobuf-compiler

      - name: Pin the same stable Rust toolchain as the verify job
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compiler outputs across independent target directories
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Rust formatting
        working-directory: app/rust
        run: cargo fmt --all -- --check

      - name: Verify isolated Rust service dependency boundaries
        run: python3 automation/check_module_boundaries.py

      - name: Regression-test fail-closed Rust impact and local developer feedback
        run: |
          python3 automation/check_ci_impact.py
          python3 automation/check_dev_rust_feedback.py

      - name: Regression-test fast CI timing and failure propagation
        run: |
          python3 automation/check_ci_phase_timing.py
          python3 automation/check_ci_merge_provenance.py
          python3 automation/check_cargo_feedback.py

      - name: Integration image boundary
        run: |
          python3 automation/smoke_integration_harness_image_contract.py
          python3 automation/check_temporal_docker_context.py

      # Only this owner publishes dependency sources. Three parallel writers to
      # the old 5.6-GB Cargo.lock/target key raced on a cache miss in CI #201.
      # Keep compiler-object reuse in sccache while measuring target-free runs.
      - name: Cache shared Cargo dependency sources (single writer)
        id: cargo_registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Determine directly changed Rust crates and dependent consumers
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          python3 automation/ci_impact.py \
            --base "$PR_BASE_SHA" \
            --head "$CI_HEAD_SHA" \
            --report automation/reports/ci_impact.json

      - name: Upload machine-readable Rust change impact report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-change-impact
          path: |
            automation/reports/ci_impact.json
          if-no-files-found: ignore

      # A cold workspace test takes longer than the five-minute PR budget.
      # Keep real fast Rust model regressions here; run all crates and real
      # PostgreSQL E2E in the comprehensive release job of this workflow.
      - name: Fast Rust runtime model unit tests
        working-directory: app/rust
        env:
          SQLX_OFFLINE: "true"
        run: cargo test -p runtime_models --locked

      - name: Publish Rust compiler cache hit/miss statistics
        if: always()
        run: sccache --show-stats

      - name: Measure Cargo dependency and compilation footprints
        if: always()
        run: python3 automation/report_ci_cargo_cache.py --job architecture-and-rust --registry-cache-hit '${{ steps.cargo_registry.outputs.cache-hit }}'

      - name: Upload Rust cache experiment measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-cache-architecture
          path: automation/reports/cargo_cache_architecture-and-rust.json
          if-no-files-found: error

  # Fast source-level contract checks; real Rust-backed checks remain in the
  # single workflow's comprehensive release job.
  rust-contract-smokes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR source and assert provenance
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"

      - name: Pin stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore shared Cargo dependency sources (read-only)
        id: cargo_registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Fast Rust manifest, crawler and proto contracts
        run: |
          cargo metadata --format-version 1 --no-deps --locked --manifest-path app/rust/Cargo.toml > /dev/null
          python3 automation/check_crawler_invariants.py
          python3 automation/gen_proto_contracts.py --out automation/PROTO_CONTRACTS.md --check
          python3 automation/check_run_report_completeness.py

  # Fast PR truth-policy acceptance. Full real-worker 16-fixture certification
  # runs for Ready-for-review PRs, not for each draft iteration.
  product-truth:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Match the established Product/Truth Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Fast Product and truth invariants
        run: bash automation/measure_ci_phase.sh product bash automation/ci_fast_verify.sh product

      - name: Upload measured Product/Truth phase timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-phase-product
          path: automation/reports/ci_phase_timings.jsonl
          if-no-files-found: ignore

  rust-security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head without third-party actions
        shell: bash
        env:
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${CI_SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"

      # Official RustSec release binary: a 6-MB download instead of compiling
      # cargo-audit from sources for ~196s on a fresh GitHub runner.
      - name: Install pinned RustSec release with verified SHA-256
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -t cargo-audit.XXXXXX.tgz)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -o "$archive" \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz
          printf '%s  %s\n' 'b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59' "$archive" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzOf "$archive" cargo-audit-x86_64-unknown-linux-gnu-v0.23.0/cargo-audit > "$HOME/.cargo/bin/cargo-audit"
          chmod 755 "$HOME/.cargo/bin/cargo-audit"
          cargo audit --version

      - name: RustSec audit
        working-directory: app/rust
        run: cargo audit

      # Read-only diagnostics run on audit failure. Keep the audit result
      # blocking; feature paths are required before changing Temporal/SQLx.
      - name: Diagnose vulnerable dependency feature paths
        if: failure()
        working-directory: app/rust
        run: |
          cargo tree --locked --target all -e features -i ringbuf || true
          cargo tree --locked --target all -e features -i rsa || true
          cargo tree --locked --target all -e features -i sqlx-mysql@0.8.6 || true
          cargo tree --locked --target all -e features -i sqlx-mysql@0.9.0 || true

  cloudflare-static-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install native cf static build dependencies
        run: npm install --prefix infra/cloudflare/seo-static --no-audit --no-fund
      - name: Offline Cloudflare publication boundary tests
        run: python3 automation/smoke_seo_cloudflare_deploy.py
      - name: Actual cf CLI build and asset preservation (no deployment)
        shell: bash
        working-directory: infra/cloudflare/seo-static
        run: |
          set -euo pipefail
          public="$(mktemp -d)"
          printf '<!doctype html><html><body><h1>Test</h1></body></html>\\n' > "$public/index.html"
          printf 'User-agent: *\\nDisallow: /\\n' > "$public/robots.txt"
          ALEGRIA_CF_PUBLIC_DIR="$public" ./node_modules/.bin/cf deploy --dry-run
          built=".cloudflare/output/v0/workers/default/assets/index.html"
          test -f "$built"
          cmp "$public/index.html" "$built"

  stack-temporal-postgres18:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate all Compose services and current image syntax
        run: docker compose config --quiet
      - name: Boot supported PostgreSQL 18 + Temporal 1.32 and initialize namespace
        run: |
          set -euo pipefail
          docker compose up -d temporal-namespace
          docker compose wait temporal-namespace
          test "$(docker inspect -f '{{.State.ExitCode}}' alegria_temporal_schema)" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' alegria_temporal_namespace)" = "0"
          docker compose run --rm --no-deps --entrypoint temporal temporal-namespace \
            operator namespace describe --namespace default --address temporal-server:7233
      - name: Keep failure evidence and clean only disposable CI volumes
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 temporal-schema temporal-server temporal-namespace || true
          docker compose down -v --remove-orphans

  stack-storage-graph:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate upgraded persistent services as actual containers
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up -d --wait postgres pgbouncer neo4j qdrant
          docker compose exec -T postgres pg_isready -U postgres -d alegria
          docker compose exec -T pgbouncer pgbouncer -V | grep -F '1.26.1'
          test "$(docker compose exec -T -e PGPASSWORD=postgres_password postgres \
            psql -h pgbouncer -p 6432 -U postgres -d alegria -Atqc 'SELECT 1' | tr -d '\r')" = "1"
          docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_password \
            'RETURN 1 AS healthy'
          docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_password \
            'CALL gds.version() YIELD gdsVersion RETURN gdsVersion'
          curl --retry 12 --retry-delay 3 --retry-connrefused -fsS \
            http://127.0.0.1:6333/collections
      - name: Print version and errors, remove only disposable CI volumes
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 postgres pgbouncer neo4j qdrant || true
          docker compose down -v --remove-orphans

  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check ruff==0.17.6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore shared Cargo dependency sources (read-only)
        id: cargo_registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install lightweight Python policy tool
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Fast source contracts and policy
        run: bash automation/measure_ci_phase.sh contracts bash automation/ci_fast_verify.sh contracts

      - name: Fast integration and consistency checks
        run: bash automation/measure_ci_phase.sh integration bash automation/ci_fast_verify.sh integration

      - name: Upload measured Contracts/Integration phase timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-phase-verify
          path: |
            automation/reports/ci_phase_timings.jsonl
          if-no-files-found: ignore

      - name: Render consistency report
        if: always()
        run: bash automation/audit.sh report

      - name: Upload consistency reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-reports
          path: |
            automation/reports/consistency_report.json
            automation/reports/consistency_report.md

  windows-operator-smoke:
    if: github.event_name == 'pull_request'
    name: Native Windows first-site operator regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical GitHub source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup native Windows Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run native Windows-only staging regression
        shell: pwsh
        run: |
          python automation/check_windows_staging_rollback.py
          pwsh -NoProfile -NonInteractive -File automation/smoke_windows_staging_reconcile.ps1
          pwsh -NoProfile -NonInteractive -File automation/smoke_windows_staging_image_artifact.ps1
          pwsh -NoProfile -NonInteractive -File automation/smoke_windows_staging_source_provenance.ps1

  gate:
    name: CI
    if: always()
    needs:
      - architecture-and-rust
      - rust-contract-smokes
      - product-truth
      - rust-security
      - cloudflare-static-build
      - stack-temporal-postgres18
      - stack-storage-graph
      - verify
      - windows-operator-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory job to succeed
        if: github.event_name == 'pull_request'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = {name: item["result"] for name, item in json.loads(os.environ["NEEDS_JSON"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          if not results or any(result != "success" for result in results.values()):
              print("CI_GATE=FAIL")
              sys.exit(1)
          print("CI_GATE=PASS")
          PY

      - name: Permit manual deep diagnostics without a release
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual deep verification; package is PR-only"

      - name: Verify main merge comes from a fully successful PR CI
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["REPO_NAME"]
          merge_sha = os.environ["MERGE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          expected_jobs = {
              "architecture-and-rust", "rust-contract-smokes", "product-truth", "rust-security", "cloudflare-static-build",
              "stack-temporal-postgres18",
              "stack-storage-graph", "verify",
              "Native Windows first-site operator regression", "CI",
              "comprehensive", "package",
          }

          def fetch(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "alegria-merge-provenance",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as result:
                  return json.load(result)

          def require(condition, reason):
              if not condition:
                  sys.exit(f"CI_GATE=FAIL {reason}")

          commit = fetch(f"commits/{merge_sha}")
          parents = [parent["sha"] for parent in commit["parents"]]
          require(len(parents) == 2, "main commit must be a two-parent GitHub PR merge")
          source_sha = parents[1]
          pull_requests = fetch(f"commits/{merge_sha}/pulls")
          matches = [
              pr for pr in pull_requests
              if pr["merged_at"] and pr["merge_commit_sha"] == merge_sha
              and pr["head"]["sha"] == source_sha and pr["base"]["ref"] == "main"
          ]
          require(len(matches) == 1, "merge commit does not match one accepted PR head")
          merge_tree = fetch(f"git/commits/{merge_sha}")["tree"]["sha"]
          source_tree = fetch(f"git/commits/{source_sha}")["tree"]["sha"]
          require(merge_tree == source_tree, "merge tree differs from fully tested PR source tree")
          runs = fetch(f"actions/runs?head_sha={source_sha}&per_page=100")["workflow_runs"]
          accepted = [
              run for run in runs
              if run["head_sha"] == source_sha and run["event"] == "pull_request"
              and run["name"] == "ci" and run["status"] == "completed"
              and run["conclusion"] == "success"
          ]
          require(bool(accepted), "exact source PR head has no successful release CI")
          accepted.sort(key=lambda run: run["id"], reverse=True)
          run = accepted[0]
          results = {
              job["name"]: job["conclusion"]
              for job in fetch(f"actions/runs/{run['id']}/jobs?per_page=100")["jobs"]
          }
          require(
              all(results.get(job) == "success" for job in expected_jobs),
              "source PR full CI did not pass every mandatory owner",
          )
          print(f"CI_GATE=PASS merge={merge_sha} pr={matches[0]['number']} source={source_sha} full_ci={run['id']}")
          PY

  # Draft changes keep their fast 10/10 feedback. Ready-for-review PRs earn
  # real Rust/PG/Truth acceptance in this SAME workflow before packaging.
  # A manual dispatch performs deep diagnostics but never publishes an image.
  comprehensive:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      TRUTH_CERT_SUITE_TARGET_DIR: ${{ github.workspace }}/app/rust/target
      PLAYWRIGHT_DRIVER_VERSION: "1.65.0"
      DATABASE_URL: postgres://alegria_ci:alegria_ci_only@127.0.0.1:5432/alegria_ci
      ALEGRIA_SCOPED_TRUTH_TEST: "true"
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: alegria_ci
          POSTGRES_PASSWORD: alegria_ci_only
          POSTGRES_DB: alegria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alegria_ci -d alegria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}

      - name: Preflight publication source contract
        run: python3 automation/smoke_incremental_publish_path.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      # The fast Rust owner has completed before this job starts. Restore its
      # exact-lockfile registry cache without creating a second cache writer.
      - name: Reuse shared Cargo dependency sources (read-only)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install full regression tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep protobuf-compiler postgresql-client
          python -m pip install --disable-pip-version-check ruff==0.17.6
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f app/db/schema.sql

      - name: Workspace unit tests
        working-directory: app/rust
        run: cargo test --workspace --locked

      - name: All retained-source/editorial PostgreSQL regressions
        working-directory: app/rust
        run: |
          cargo test -p integration_harness --features e2e --locked --lib retained_corpus_reuses_exact_paid_result_and_raw_pages_without_acquisition
          cargo test -p integration_harness --features e2e --locked --lib retained_raw_retrieval_requires_prior_receipts_and_exact_current_page_points
          cargo test -p integration_harness --features e2e --locked --lib changed_editorial_request_supersedes_only_pending_same_page_task
          cargo test -p integration_harness --features e2e --locked --lib published_page_review_requires_exact_pending_revision_and_active_workflow
          cargo test -p integration_harness --features e2e --locked --lib cms_publish_keeps_verified_links_structured_without_duplicate_body_sections
          cargo test -p integration_harness --features e2e --locked --lib content_gap_owner_identity_is_idempotent_and_independently_resolved
          cargo test -p integration_harness --features e2e --locked --lib keyword_cluster_natural_owner_survives_changed_serp_family

      # Preserve ci_verify.sh all coverage, but split the exact same ordered
      # phases so GitHub shows their real critical path and allows scoped reuse.
      - name: Full architecture and Rust-backed contracts
        run: bash automation/ci_verify.sh contracts

      - name: Full Product/Truth and real Worker certification
        run: bash automation/ci_verify.sh product

      - name: Full service integration with already-built real Workers
        env:
          # Product/Truth built and tested these binaries in this same job.
          # Manual LLM E2E must not recompile them from the default target.
          INTEGRATION_TEMPORAL_WORKER_BIN: ${{ github.workspace }}/app/rust/target/integration-harness-nested/workers/debug/temporal_worker
          INTEGRATION_OUTBOX_WORKER_BIN: ${{ github.workspace }}/app/rust/target/integration-harness-nested/workers/debug/outbox_worker
          # Semantic fixture runs after all other Cargo commands, so reuse
          # the workspace target rather than a fourth cold build graph.
          WHOLE_PAGE_SEMANTIC_TARGET_DIR: ${{ github.workspace }}/app/rust/target
        run: bash automation/ci_verify.sh integration

      - name: Rust compiler cache statistics
        if: always()
        run: sccache --show-stats

      - name: Preserve deep regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-ci-evidence
          path: |
            automation/reports/ci_phase_timings.jsonl
            automation/reports/consistency_report.json
          if-no-files-found: ignore

  # Compile the native Worker ONCE from the accepted PR head. The signed image
  # is deployed after merge only if the merge tree matches this exact source.
  # No post-merge Docker or Rust rebuild is required.
  package:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.gate.result == 'success' && needs.comprehensive.result == 'success'
    needs: [gate, comprehensive]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify requested commit identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up official Docker Buildx builder
        uses: docker/setup-buildx-action@v4

      - name: Build canonical Temporal Worker release image with persistent layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/rust/services/temporal/Dockerfile
          push: false
          load: true
          tags: alegria-seo-temporal:ci
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            by.alegria.source-head-sha=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=alegria-temporal-worker
          cache-to: type=gha,scope=alegria-temporal-worker,mode=max

      - name: Verify runtime includes its native deployment tools
        run: |
          docker run --rm --entrypoint /bin/sh alegria-seo-temporal:ci -ec '
            command -v python3
            command -v node
            command -v temporal_worker
            command -v temporal_starter
            temporal_starter --help >/dev/null
            test -x /app/infra/cloudflare/seo-static/node_modules/.bin/cf
            test -f /app/infra/cloudflare/seo-static/vite.config.ts
            python3 -m py_compile /app/automation/deploy_seo_static_cloudflare.py
            python3 -m py_compile /app/automation/check_first_site_release.py
            test -f /app/automation/check_first_site_release.py
          '

      - name: Archive exact image for no-build Windows staging
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/temporal-worker-artifact"
          mkdir -p "$artifact_dir"
          label="$(docker image inspect --format '{{index .Config.Labels "by.alegria.source-head-sha"}}' alegria-seo-temporal:ci)"
          test "$label" = "$SOURCE_SHA"
          docker save alegria-seo-temporal:ci | gzip -1 > "$artifact_dir/temporal-worker.tar.gz"
          (cd "$artifact_dir" && sha256sum temporal-worker.tar.gz > temporal-worker.tar.gz.sha256)
          docker image inspect --format '{{.Id}}' alegria-seo-temporal:ci > "$artifact_dir/image-id.txt"
          printf '%s\n' "$SOURCE_SHA" > "$artifact_dir/source-sha.txt"

      - name: Sign source-specific archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/temporal-worker-artifact/temporal-worker.tar.gz

      - name: Upload source-specific Worker image
        uses: actions/upload-artifact@v7
        with:
          name: temporal-worker-image-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/temporal-worker-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
