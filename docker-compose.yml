services:
  # 1. Слой данных (PostgreSQL для бизнес-данных Alegria)
  postgres:
    image: postgres:16-alpine
    container_name: alegria_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: alegria
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/init.sql # Авто-накат схемы при старте
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1b. Отдельная БД для Temporal (service persistence)
  postgres-temporal:
    image: postgres:16-alpine
    container_name: alegria_postgres_temporal
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_password
      POSTGRES_DB: temporal
    ports:
      - "5434:5432"
    volumes:
      - postgres_temporal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: alegria_pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres_password
      DB_NAME: alegria
      POOL_MODE: session
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20

  # 2. Слой графов (Neo4j с плагинами APOC и GDS)
  neo4j:
    image: neo4j:2026.02.2
    container_name: alegria_neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      # Включаем APOC для apoc.periodic.iterate
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt протокол
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Слой векторного поиска (Qdrant)
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: alegria_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Слой оркестрации (Prefect Server)

  # 5. Temporal Server (заменяет Prefect)
  temporal-server:
    image: temporalio/auto-setup:1.28
    container_name: alegria_temporal
    depends_on:
      postgres-temporal:
        condition: service_healthy   # ждём healthcheck postgres
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal_password
      - POSTGRES_SEEDS=postgres-temporal      # имя сервиса в compose-сети
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamicconfig.yaml
      - BIND_ON_IP=0.0.0.0
    volumes:
      - ./infra/temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "localhost:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10

  # 6. Production Analytics Service (Rust runtime)
  analytics-service:
    build:
      context: .
      dockerfile: ./app/rust/services/analytics_svc/Dockerfile
    container_name: alegria_analytics
    ports:
      - "50051:50051"   # gRPC runtime endpoint
    environment:
      NEO4J_URI:      neo4j:7687
      NEO4J_USER:     neo4j
      NEO4J_PASSWORD: neo4j_password
      GRPC_PORT:      "50051"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure:3

  # 7. Python analytics_lab (R&D only, not runtime)
  analytics-lab:
    build:
      context: .
      dockerfile: ./infra/analytics_lab/Dockerfile
    container_name: alegria_analytics_lab
    profiles: ["lab"]
    ports:
      - "50061:50051"
    environment:
      NEO4J_URI:      bolt://neo4j:7687
      NEO4J_USER:     neo4j
      NEO4J_PASSWORD: neo4j_password
      GRPC_PORT:      "50051"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure:3

  # 8. Temporal UI
  temporal-ui:
    image: temporalio/ui:2.48.1
    container_name: alegria_temporal_ui
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
    ports:
      - "8233:8233"

  # 9. Rust Temporal Worker (executes workflows/activities)
  temporal-worker:
    build:
      context: .
      dockerfile: ./app/rust/services/temporal/Dockerfile
    container_name: alegria_temporal_worker
    environment:
      TEMPORAL_URL: http://temporal-server:7233
      DATABASE_URL: postgres://postgres:postgres_password@pgbouncer:6432/alegria
      RUST_LOG: info
      METRICS_PORT: "9464"
      WORKER_BUILD_ID: ${WORKER_BUILD_ID:-docker-dev}
      QDRANT_URL: http://qdrant:6334
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DATAFORSEO_ENDPOINT: ${DATAFORSEO_ENDPOINT:-}
      DATAFORSEO_LANGUAGE_CODE: ${DATAFORSEO_LANGUAGE_CODE:-ru}
      DATAFORSEO_LOCATION_CODE: ${DATAFORSEO_LOCATION_CODE:-2643}
      DATAFORSEO_DEPTH: ${DATAFORSEO_DEPTH:-10}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3-large}
      SEO_LLM_PROVIDER: ${SEO_LLM_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SEO_MODEL: ${OPENAI_SEO_MODEL:-gpt-5.2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      temporal-server:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      qdrant:
        condition: service_healthy
    restart: on-failure:3
    ports:
      - "9464:9464"

  # 10. Runtime outbox materializer (PostgreSQL -> Neo4j/Qdrant projections)
  outbox-worker:
    build:
      context: .
      dockerfile: ./app/rust/services/outbox_worker/Dockerfile
    container_name: alegria_outbox_worker
    environment:
      DATABASE_URL: postgres://postgres:postgres_password@pgbouncer:6432/alegria
      RUST_LOG: info
      WORKER_BUILD_ID: ${WORKER_BUILD_ID:-docker-dev}
      OUTBOX_WORKER_ID: ${OUTBOX_WORKER_ID:-docker-outbox-worker}
      NEO4J_URI: neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      QDRANT_URL: http://qdrant:6334
    depends_on:
      pgbouncer:
        condition: service_started
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: on-failure:3

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: alegria_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      temporal-worker:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.1
    container_name: alegria_grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  postgres_temporal_data:
  neo4j_data:
  qdrant_data:
