syntax = "proto3";
package alegria.analytics.v1;

service GraphAnalyticsService {
  // Компоненты связности (WCC) — кластеризация context_key
  rpc RunWCC          (WCCRequest)       returns (WCCResult);
  // PageRank — ранжирование контекстов по важности
  rpc ComputePageRank (PageRankRequest)  returns (PageRankResult);
  // Построение плана внутренних ссылок
  rpc BuildLinkPlan   (LinkPlanRequest)  returns (LinkPlanResult);
  // Health check (Circuit Breaker в Rust)
  rpc Ping            (PingRequest)      returns (PingResponse);
}

message WCCRequest {
  string graph_name  = 1;
  int32  min_cluster = 2;
}
message WCCResult {
  map<string, int64> assignments = 1; // context_key → cluster_id
  int32  cluster_count = 2;
  string status        = 3;           // "ok" | "graph_empty"
}

message PageRankRequest {
  string graph_name   = 1;
  int32  top_n        = 2;
  float  damping      = 3;
}
message PageRankResult {
  repeated PageRankEntry entries = 1;
}
message PageRankEntry {
  string context_key = 1;
  float  score       = 2;
}

message LinkPlanRequest {
  string context_key = 1;
  int32  max_links   = 2;
}
message LinkPlanResult {
  repeated LinkEntry links = 1;
}
message LinkEntry {
  string from_key        = 1;
  string to_key          = 2;
  float  relevance_score = 3;
}

message PingRequest  {}
message PingResponse { string version = 1; }
