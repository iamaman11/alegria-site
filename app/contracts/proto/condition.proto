syntax = "proto3";

package alegria.condition.v1;

message ScalarValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

message ConditionExprV1 {
  int32 v = 1;
  string op = 2;
  string field = 3;
  ScalarValue value = 4;
  repeated ConditionExprV1 args = 5;
}
