[package]
name = "temporal_worker"
version = "0.1.0"
edition = "2021"

[features]
default = []
graphflow_experimental = []

[dependencies]
# Required by Temporal proc-macros (`#[activities]`, `#[workflow_methods]`):
# macros resolve these crates by canonical crate names.
temporalio-sdk = { workspace = true }
temporalio-sdk-core = { workspace = true }
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
temporalio-macros = { workspace = true }
infrastructure = { path = "../../crates/infrastructure" }
policies = { path = "../../crates/policies" }
seo_steps = { path = "../../crates/seo_steps" }
primitives = { path = "../../crates/primitives" }
contracts = { path = "../../crates/contracts" }
seo_domain = { path = "../../crates/seo_domain" }
seo_ports = { path = "../../crates/seo_ports" }
seo_application = { path = "../../crates/seo_application" }
runtime_models = { path = "../../crates/runtime_models" }
clap = { version = "4", features = ["derive"] }
uuid = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
futures = "0.3"
futures-util = "0.3"
prometheus = "0.14"
