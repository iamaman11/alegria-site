[package]
name = "integration_pg_v3_e2e"
version = "0.1.0"
edition = "2021"

# A dedicated test target for the PG V3 effect owner. Keep its compile closure
# independent from integration_harness, runtime_composition, infrastructure,
# Neo4j/Qdrant adapters and every legacy Worker. All costly dependencies are
# gated so an ordinary workspace test does not build this E2E target.
[features]
default = []
e2e = [
  "dep:anyhow",
  "dep:operation_protocol",
  "dep:postgres_store",
  "dep:serde_json",
  "dep:serial_test",
  "dep:sqlx",
  "dep:temporalio-client",
  "dep:temporalio-common",
  "dep:url",
  "dep:testcontainers",
  "dep:tokio",
  "dep:truth_domain",
  "dep:uuid",
]

[dependencies]
anyhow = { workspace = true, optional = true }
operation_protocol = { path = "../operation_protocol", optional = true }
postgres_store = { path = "../postgres_store", optional = true }
serde_json = { workspace = true, optional = true }
serial_test = { version = "3.2.0", optional = true }
sqlx = { workspace = true, optional = true }
temporalio-client = { workspace = true, optional = true }
temporalio-common = { workspace = true, optional = true }
url = { workspace = true, optional = true }
testcontainers = { version = "0.28.0", optional = true }
tokio = { workspace = true, optional = true }
truth_domain = { path = "../truth_domain", optional = true }
uuid = { workspace = true, optional = true }
