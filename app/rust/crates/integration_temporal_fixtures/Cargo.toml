[package]
name = "integration_temporal_fixtures"
version = "0.1.0"
edition = "2021"

# One authentic disposable Temporal server and vendor-schema bootstrap, shared
# between independent E2E owners; never an in-memory workflow substitute.
[features]
default = []
e2e = [
  "dep:anyhow",
  "dep:temporalio-client",
  "dep:temporalio-sdk-core",
  "dep:testcontainers",
  "dep:tokio",
  "dep:uuid",
]

[dependencies]
anyhow = { workspace = true, optional = true }
temporalio-client = { workspace = true, optional = true }
temporalio-sdk-core = { workspace = true, optional = true }
testcontainers = { version = "0.28.0", optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
