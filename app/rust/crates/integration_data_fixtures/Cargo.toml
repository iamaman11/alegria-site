[package]
name = "integration_data_fixtures"
version = "0.1.0"
edition = "2021"

# Disposable real PostgreSQL/Qdrant fixtures shared by the broad integration
# harness and isolated Outbox owner. No production runtime/Temporal/Neo4j edge.
[features]
default = []
pg = [
  "dep:anyhow",
  "dep:sqlx",
  "dep:serde_json",
  "dep:testcontainers",
  "dep:tokio",
]
qdrant = [
  "dep:anyhow",
  "dep:testcontainers",
  "dep:tokio",
  "dep:vector_qdrant",
]
# The existing real PG+Qdrant contract is preserved for broad/A14 consumers.
# New PG-only owners can omit Qdrant's provider client entirely.
e2e = ["pg", "qdrant"]

[dependencies]
anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
testcontainers = { version = "0.28.0", optional = true }
tokio = { workspace = true, optional = true }
vector_qdrant = { path = "../vector_qdrant", optional = true }
