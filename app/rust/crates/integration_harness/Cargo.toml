[package]
name = "integration_harness"
version = "0.1.0"
edition = "2021"

[features]
default = []
e2e = [
  "dep:integration_data_fixtures",
  "integration_data_fixtures/e2e",
  "dep:integration_graph_fixtures",
  "integration_graph_fixtures/e2e",
  "dep:integration_temporal_fixtures",
  "integration_temporal_fixtures/e2e",
  "dep:infrastructure",
  "dep:runtime_composition",
  "dep:graph_neo4j",
  "dep:vector_qdrant",
  "dep:sqlx",
  "dep:temporalio-client",
  "dep:temporalio-common",
  "dep:temporal_gateway",
  "dep:testcontainers",
  "dep:uuid",
]

[dependencies]
anyhow = { workspace = true }
integration_data_fixtures = { path = "../integration_data_fixtures", optional = true }
integration_graph_fixtures = { path = "../integration_graph_fixtures", optional = true }
integration_test_env = { path = "../integration_test_env" }
integration_temporal_fixtures = { path = "../integration_temporal_fixtures", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
axum = { version = "0.8.8", features = ["json"] }
sqlx = { workspace = true, optional = true }
testcontainers = { version = "0.28.0", optional = true }
vector_qdrant = { path = "../vector_qdrant", optional = true }
graph_neo4j = { path = "../graph_neo4j", optional = true }
infrastructure = { path = "../infrastructure", optional = true }
runtime_composition = { path = "../runtime_composition", optional = true }
temporalio-client = { workspace = true, optional = true }
temporalio-common = { workspace = true, optional = true }
temporal_gateway = { path = "../temporal_gateway", optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
postgres_store = { path = "../postgres_store" }
operation_protocol = { path = "../operation_protocol" }
async-trait = "0.1"
contracts = { path = "../contracts" }
primitives = { path = "../primitives" }
infrastructure = { path = "../infrastructure" }
runtime_composition = { path = "../runtime_composition" }
projection_delivery = { path = "../projection_delivery" }
seo_application = { path = "../seo_application" }
seo_domain = { path = "../seo_domain" }
seo_ports = { path = "../seo_ports" }
seo_steps = { path = "../seo_steps" }
serial_test = "3.2.0"
prost = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
