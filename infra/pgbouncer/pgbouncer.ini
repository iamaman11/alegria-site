[databases]
alegria = host=postgres port=5432 dbname=alegria user=postgres password=postgres_password

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
max_client_conn = 200
ignore_startup_parameters = extra_float_digits,search_path
admin_users = postgres
server_reset_query = DISCARD ALL
server_tls_sslmode = disable
log_connections = 1
log_disconnections = 1
